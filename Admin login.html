<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brit.Tuna Admin Login</title>
  <meta name="description" content="Admin sign in for store management.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1f5a3a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="login-body" data-page="login">
  <main class="login-card">
    <div class="login-brand">
      <div class="logo-mark" aria-hidden="true">B</div>
      <h1>BRIT.TUNA ADMIN</h1>
      <p class="muted" id="loginHint">Sign in to manage your products.</p>
    </div>

    <div id="loginAlert" class="alert alert-error hidden" role="alert"></div>

    <form id="loginForm" novalidate>
      <div class="field" id="emailField">
        <label for="email">Email <span class="req">*</span></label>
        <input id="email" type="email" autocomplete="username" placeholder="admin@example.com">
        <div class="field-error">Enter a valid email address.</div>
      </div>
      <div class="field">
        <label for="password" id="passLabel">Password <span class="req">*</span></label>
        <div class="pw-wrap">
          <input id="password" type="password" autocomplete="current-password">
          <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">Show</button>
        </div>
        <div class="field-error">This field is required.</div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Sign in</button>
    </form>

    <p class="login-foot"><a href="index.html">← Back to website</a></p>
  </main>
  <!-- Load order matters: config → supabase → admin -->
  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script src="admin.js"></script>
</body>
</html>
