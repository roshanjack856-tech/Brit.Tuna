<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Order Details | Brit.Tuna</title>

  <meta
    name="robots"
    content="noindex"
  >

  <meta
    name="theme-color"
    content="#1f5a3a"
  >


  <!-- Google Fonts -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap"
    rel="stylesheet"
  >


  <!-- Brit.Tuna CSS -->

  <link
    rel="stylesheet"
    href="style.css"
  >

  <link
    rel="stylesheet"
    href="responsive.css"
  >


  <style>

    /* ======================================================
       ORDER CONFIRMATION
       ====================================================== */

    .confirmation-wrap {
      max-width: 900px;
      margin: 0 auto;
    }


    .confirmation-message {
      padding: 18px;
      border-radius: 14px;
      background: #f7f4eb;
      color: #34423a;
      text-align: center;
      margin-bottom: 24px;
    }


    .confirmation-message.error {
      background: #fff0ed;
      color: #9c2f25;
    }


    .confirmation-message.success {
      background: #edf7f0;
      color: #1f5a3a;
    }


    .confirmation-card {
      background: #ffffff;
      border: 1px solid rgba(31, 90, 58, 0.12);
      border-radius: 20px;
      padding: 26px;
      box-shadow: 0 8px 30px rgba(25, 50, 35, 0.06);
    }


    /* ======================================================
       HEADER
       ====================================================== */

    .confirmation-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid #ecebe5;
    }


    .confirmation-top h2 {
      margin: 0 0 6px;
      color: #173d29;
      font-family: "Fraunces", serif;
      font-size: 1.5rem;
    }


    .confirmation-date {
      margin: 0;
      color: #6d746f;
      font-size: 0.9rem;
    }


    .confirmation-total {
      color: #1f5a3a;
      font-size: 1.35rem;
      font-weight: 700;
      white-space: nowrap;
    }


    /* ======================================================
       STATUS
       ====================================================== */

    .confirmation-statuses {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin: 20px 0;
    }


    .confirmation-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 12px;
      border-radius: 999px;
      background: #eef4ef;
      color: #1f5a3a;
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: capitalize;
    }


    .confirmation-badge.payment {
      background: #fff3df;
      color: #8a5a0a;
    }


    /* ======================================================
       TEST ORDER NOTICE
       ====================================================== */

    .test-order-notice {
      padding: 13px 15px;
      margin-bottom: 22px;
      border-radius: 12px;
      background: #fff8e8;
      color: #775410;
      line-height: 1.55;
      font-size: 0.86rem;
    }


    .test-order-notice strong {
      color: #614207;
    }


    /* ======================================================
       CUSTOMER INFO
       ====================================================== */

    .confirmation-section {
      margin-top: 25px;
    }


    .confirmation-section-title {
      margin: 0 0 15px;
      color: #173d29;
      font-family: "Fraunces", serif;
      font-size: 1.15rem;
    }


    .customer-grid {
      display: grid;
      grid-template-columns:
        repeat(
          2,
          minmax(0, 1fr)
        );
      gap: 15px;
    }


    .customer-info-box {
      padding: 14px;
      border-radius: 12px;
      background: #f8faf8;
    }


    .customer-info-label {
      display: block;
      color: #788078;
      font-size: 0.76rem;
      font-weight: 600;
      margin-bottom: 5px;
    }


    .customer-info-value {
      color: #29352e;
      font-weight: 700;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }


    .customer-info-box.full {
      grid-column: 1 / -1;
    }


    /* ======================================================
       ORDER ITEMS
       ====================================================== */

    .confirmation-items {
      margin: 0;
      padding: 0;
      list-style: none;
    }


    .confirmation-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      padding: 17px 0;
      border-bottom: 1px dashed #dedfd9;
    }


    .confirmation-item:last-child {
      border-bottom: 0;
    }


    .confirmation-item-left {
      flex: 1;
      min-width: 0;
    }


    .confirmation-item-name {
      display: block;
      margin-bottom: 6px;
      color: #29352e;
      font-size: 1rem;
      font-weight: 700;
    }


    .confirmation-item-details {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 8px;
    }


    .item-detail {
      display: inline-flex;
      align-items: center;
      padding: 5px 9px;
      border-radius: 8px;
      background: #f3f4f1;
      color: #626b65;
      font-size: 0.77rem;
      font-weight: 600;
    }


    .item-detail.pack {
      background: #edf5ef;
      color: #1f5a3a;
      font-weight: 700;
    }


    .confirmation-item-price {
      color: #1f5a3a;
      font-weight: 700;
      white-space: nowrap;
      text-align: right;
    }


    .unit-price {
      display: block;
      margin-top: 4px;
      color: #788078;
      font-size: 0.73rem;
      font-weight: 500;
    }


    /* ======================================================
       SELLER STATUS
       ====================================================== */

    .seller-status-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      margin-top: 10px;
    }


    .seller-status-label {
      color: #6d746f;
      font-size: 0.78rem;
      font-weight: 600;
    }


    .seller-status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.76rem;
      line-height: 1;
      font-weight: 700;
      text-transform: capitalize;
    }


    .seller-status.pending {
      background: #fff3df;
      color: #8a5a0a;
    }


    .seller-status.processing {
      background: #e8f1ff;
      color: #245ea8;
    }


    .seller-status.shipped {
      background: #eee8ff;
      color: #6340a5;
    }


    .seller-status.delivered {
      background: #e8f7ec;
      color: #18723a;
    }


    .seller-status.cancelled {
      background: #fff0ed;
      color: #a52f25;
    }


    .seller-status.unknown {
      background: #f1f2f1;
      color: #58625c;
    }


    /* ======================================================
       STATUS HELP
       ====================================================== */

    .status-help {
      margin-top: 15px;
      padding: 12px 14px;
      border-radius: 11px;
      background: #f8faf8;
      color: #66716a;
      font-size: 0.8rem;
      line-height: 1.6;
    }


    .status-help strong {
      color: #1f5a3a;
    }


    /* ======================================================
       SUMMARY
       ====================================================== */

    .order-summary {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid #ecebe5;
    }


    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 8px;
      color: #59635d;
    }


    .summary-row.total {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #ecebe5;
      color: #173d29;
      font-size: 1.15rem;
      font-weight: 700;
    }


    .summary-row.total strong {
      color: #1f5a3a;
    }


    /* ======================================================
       ACTIONS
       ====================================================== */

    .confirmation-actions {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 25px;
    }


    .confirmation-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 17px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      transition: 0.2s ease;
    }


    .confirmation-btn.primary {
      background: #1f5a3a;
      color: #ffffff;
    }


    .confirmation-btn.secondary {
      border: 1px solid rgba(31, 90, 58, 0.22);
      background: #ffffff;
      color: #1f5a3a;
    }


    .confirmation-btn:hover {
      transform: translateY(-1px);
      opacity: 0.92;
    }


    /* ======================================================
       MOBILE
       ====================================================== */

    @media (max-width: 650px) {

      .confirmation-card {
        padding: 18px;
      }


      .confirmation-top {
        flex-direction: column;
        gap: 10px;
      }


      .customer-grid {
        grid-template-columns: 1fr;
      }


      .customer-info-box.full {
        grid-column: auto;
      }


      .confirmation-item {
        flex-direction: column;
        gap: 10px;
      }


      .confirmation-item-price {
        text-align: left;
      }


      .confirmation-actions {
        flex-direction: column;
      }


      .confirmation-btn {
        width: 100%;
      }

    }

  </style>

</head>


<body data-page="order-confirmation">


  <!-- ======================================================
       HEADER
       ====================================================== -->

  <div id="site-header"></div>


  <!-- ======================================================
       MAIN
       ====================================================== -->

  <main id="main">


    <section class="page-hero">

      <div class="container">

        <h1>
          Order Details
        </h1>

        <p>
          Review your Brit.Tuna order and product fulfillment status.
        </p>

      </div>

    </section>


    <section class="container page-body">

      <div class="confirmation-wrap">


        <!-- MESSAGE -->

        <div
          id="confirmation-message"
          class="confirmation-message"
          role="status"
          aria-live="polite"
        >
          Loading your order...
        </div>


        <!-- ORDER CONTENT -->

        <div
          id="confirmation-content"
          hidden
        ></div>


      </div>

    </section>


  </main>


  <!-- ======================================================
       FOOTER
       ====================================================== -->

  <div id="site-footer"></div>


  <!-- ======================================================
       SUPABASE
       ====================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <!-- ======================================================
       BRIT.TUNA FILES
       ====================================================== -->

  <script src="config.js"></script>

  <script src="supabase.js"></script>

  <script src="script.js"></script>


  <!-- ======================================================
       ORDER CONFIRMATION LOGIC
       ====================================================== -->

  <script>

    (function () {

      "use strict";


      /* ====================================================
         ELEMENTS
         ==================================================== */

      var messageElement =
        document.getElementById(
          "confirmation-message"
        );


      var contentElement =
        document.getElementById(
          "confirmation-content"
        );


      /* ====================================================
         ESCAPE HTML
         ==================================================== */

      function escapeHtml(value) {

        return String(
          value == null
            ? ""
            : value
        )

          .replace(
            /&/g,
            "&amp;"
          )

          .replace(
            /</g,
            "&lt;"
          )

          .replace(
            />/g,
            "&gt;"
          )

          .replace(
            /"/g,
            "&quot;"
          )

          .replace(
            /'/g,
            "&#039;"
          );

      }


      /* ====================================================
         MONEY
         ==================================================== */

      function formatMoney(value) {

        var amount =
          Number(
            value || 0
          );


        return new Intl.NumberFormat(
          "en-IN",
          {

            style:
              "currency",

            currency:
              "INR",

            maximumFractionDigits:
              2

          }
        ).format(
          amount
        );

      }


      /* ====================================================
         DATE
         ==================================================== */

      function formatDate(value) {

        if (!value) {

          return "";

        }


        var date =
          new Date(
            value
          );


        if (
          Number.isNaN(
            date.getTime()
          )
        ) {

          return "";

        }


        return new Intl.DateTimeFormat(
          "en-IN",
          {

            day:
              "2-digit",

            month:
              "short",

            year:
              "numeric",

            hour:
              "2-digit",

            minute:
              "2-digit"

          }
        ).format(
          date
        );

      }


      /* ====================================================
         MESSAGE
         ==================================================== */

      function showMessage(
        text,
        type
      ) {

        messageElement.textContent =
          text;


        messageElement.className =
          "confirmation-message";


        if (type) {

          messageElement.classList.add(
            type
          );

        }


        messageElement.hidden =
          false;

      }


      function hideMessage() {

        messageElement.hidden =
          true;

      }


      /* ====================================================
         SELLER FULFILLMENT
         ==================================================== */

      function normalizeFulfillmentStatus(
        status
      ) {

        var value =
          String(
            status || "pending"
          )
            .trim()
            .toLowerCase();


        var allowed = [

          "pending",

          "processing",

          "shipped",

          "delivered",

          "cancelled"

        ];


        if (
          !allowed.includes(
            value
          )
        ) {

          return "unknown";

        }


        return value;

      }


      function fulfillmentStatusHtml(
        status
      ) {

        var safeStatus =
          normalizeFulfillmentStatus(
            status
          );


        return `

          <div class="seller-status-row">

            <span class="seller-status-label">
              Seller Status:
            </span>

            <span
              class="seller-status ${escapeHtml(
                safeStatus
              )}"
            >

              ${escapeHtml(
                safeStatus
              )}

            </span>

          </div>

        `;

      }


      /* ====================================================
         PRODUCT DETAILS
         ==================================================== */

      function productDetailsHtml(
        item
      ) {

        var html =
          '<div class="confirmation-item-details">';


        /*
         * Product ID
         */

        if (
          item.product_id
        ) {

          html += `

            <span class="item-detail">

              Product ID:
              ${escapeHtml(
                item.product_id
              )}

            </span>

          `;

        }


        /*
         * PACK SIZE
         */

        if (
          item.pack_size
        ) {

          html += `

            <span class="item-detail pack">

              Pack:
              ${escapeHtml(
                item.pack_size
              )}

            </span>

          `;

        }


        /*
         * VARIANT ID
         */

        if (
          item.variant_id
        ) {

          html += `

            <span class="item-detail">

              Variant ID:
              ${escapeHtml(
                item.variant_id
              )}

            </span>

          `;

        }


        html +=
          "</div>";


        return html;

      }


      /* ====================================================
         RENDER ORDER ITEMS
         ==================================================== */

      function renderItems(items) {

        if (
          !Array.isArray(items) ||
          items.length === 0
        ) {

          return `

            <li class="confirmation-item">

              <span class="confirmation-item-name">
                Order items unavailable
              </span>

            </li>

          `;

        }


        return items.map(

          function (item) {

            var quantity =
              Number(
                item.quantity || 1
              );


            var price =
              Number(
                item.price || 0
              );


            var lineTotal =
              price *
              quantity;


            return `

              <li class="confirmation-item">


                <div class="confirmation-item-left">


                  <!-- PRODUCT -->

                  <span class="confirmation-item-name">

                    ${escapeHtml(
                      item.product_name ||
                      "Product"
                    )}

                    × ${escapeHtml(
                      quantity
                    )}

                  </span>


                  <!-- PRODUCT / PACK / VARIANT -->

                  ${productDetailsHtml(
                    item
                  )}


                  <!-- SELLER FULFILLMENT -->

                  ${fulfillmentStatusHtml(
                    item.fulfillment_status
                  )}


                </div>


                <!-- PRICE -->

                <div class="confirmation-item-price">

                  ${formatMoney(
                    lineTotal
                  )}

                  <span class="unit-price">

                    ${formatMoney(
                      price
                    )}
                    each

                  </span>

                </div>


              </li>

            `;

          }

        ).join("");

      }


      /* ====================================================
         ADDRESS
         ==================================================== */

      function buildAddress(order) {

        var parts = [

          order.shipping_address,

          order.city,

          order.state,

          order.pincode

        ].filter(

          function (value) {

            return Boolean(
              value
            );

          }

        );


        return parts.join(
          ", "
        );

      }


      /* ====================================================
         TEST ORDER NOTICE
         ==================================================== */

      function testOrderNoticeHtml(
        order
      ) {

        if (
          String(
            order.payment_method || ""
          ).toLowerCase() !==
          "test_order"
        ) {

          return "";

        }


        return `

          <div class="test-order-notice">

            <strong>
              Demo / Test Order:
            </strong>

            This order was created using the current
            test checkout flow.

            No real online payment has been processed.

          </div>

        `;

      }


      /* ====================================================
         RENDER ORDER
         ==================================================== */

      function renderOrder(
        order
      ) {

        var orderStatus =
          order.order_status ||
          "pending";


        var paymentStatus =
          order.payment_status ||
          "pending";


        var address =
          buildAddress(
            order
          );


        var items =
          Array.isArray(
            order.order_items
          )

            ? order.order_items

            : [];


        contentElement.innerHTML = `

          <article class="confirmation-card">


            <!-- HEADER -->

            <div class="confirmation-top">

              <div>

                <h2>

                  Order #${escapeHtml(
                    order.id
                  )}

                </h2>


                <p class="confirmation-date">

                  ${escapeHtml(
                    formatDate(
                      order.created_at
                    )
                  )}

                </p>

              </div>


              <div class="confirmation-total">

                ${formatMoney(
                  order.total_amount
                )}

              </div>

            </div>


            <!-- OVERALL STATUS -->

            <div class="confirmation-statuses">

              <span class="confirmation-badge">

                Order:
                ${escapeHtml(
                  orderStatus
                )}

              </span>


              <span class="confirmation-badge payment">

                Payment:
                ${escapeHtml(
                  paymentStatus
                )}

              </span>

            </div>


            <!-- TEST ORDER -->

            ${testOrderNoticeHtml(
              order
            )}


            <!-- CUSTOMER -->

            <section class="confirmation-section">

              <h3 class="confirmation-section-title">
                Customer & Delivery
              </h3>


              <div class="customer-grid">


                <div class="customer-info-box">

                  <span class="customer-info-label">
                    Customer Name
                  </span>

                  <div class="customer-info-value">

                    ${escapeHtml(
                      order.customer_name ||
                      "-"
                    )}

                  </div>

                </div>


                <div class="customer-info-box">

                  <span class="customer-info-label">
                    Phone
                  </span>

                  <div class="customer-info-value">

                    ${escapeHtml(
                      order.customer_phone ||
                      "-"
                    )}

                  </div>

                </div>


                <div class="customer-info-box">

                  <span class="customer-info-label">
                    Payment Method
                  </span>

                  <div class="customer-info-value">

                    ${escapeHtml(
                      order.payment_method ||
                      "-"
                    )}

                  </div>

                </div>


                <div class="customer-info-box">

                  <span class="customer-info-label">
                    PIN Code
                  </span>

                  <div class="customer-info-value">

                    ${escapeHtml(
                      order.pincode ||
                      "-"
                    )}

                  </div>

                </div>


                <div class="customer-info-box full">

                  <span class="customer-info-label">
                    Delivery Address
                  </span>

                  <div class="customer-info-value">

                    ${escapeHtml(
                      address ||
                      "-"
                    )}

                  </div>

                </div>


              </div>

            </section>


            <!-- PRODUCTS -->

            <section class="confirmation-section">

              <h3 class="confirmation-section-title">
                Products
              </h3>


              <ul class="confirmation-items">

                ${renderItems(
                  items
                )}

              </ul>


              <div class="status-help">

                <strong>
                  Seller Status
                </strong>

                is the fulfillment status of each individual
                product.

                A seller can move their item through

                <strong>
                  Pending → Processing → Shipped → Delivered
                </strong>

                or cancel their own item where allowed.

                <br><br>

                The

                <strong>
                  Overall Order Status
                </strong>

                is separate and is managed by Brit.Tuna Admin.

              </div>

            </section>


            <!-- TOTAL -->

            <div class="order-summary">

              <div class="summary-row total">

                <span>
                  Order Total
                </span>

                <strong>

                  ${formatMoney(
                    order.total_amount
                  )}

                </strong>

              </div>

            </div>


            <!-- ACTIONS -->

            <div class="confirmation-actions">

              <a
                href="orders.html"
                class="confirmation-btn secondary"
              >
                My Orders
              </a>


              <a
                href="shop.html"
                class="confirmation-btn primary"
              >
                Continue Shopping
              </a>

            </div>


          </article>

        `;


        contentElement.hidden =
          false;

      }


      /* ====================================================
         LOAD ORDER
         ==================================================== */

      async function loadOrder() {

        try {


          showMessage(
            "Loading your order..."
          );


          contentElement.hidden =
            true;


          /* ----------------------------------------------
             SUPABASE
             ---------------------------------------------- */

          if (
            !window.supabaseClient
          ) {

            throw new Error(
              "Supabase connection is not available."
            );

          }


          /* ----------------------------------------------
             ORDER ID FROM URL
             ---------------------------------------------- */

          var params =
            new URLSearchParams(
              window.location.search
            );


          var orderIdValue =
            params.get(
              "order"
            );


          if (
            !orderIdValue
          ) {

            throw new Error(
              "Order ID is missing."
            );

          }


          /*
           * Orders use BIGINT.
           */

          if (
            !/^\d+$/.test(
              orderIdValue
            )
          ) {

            throw new Error(
              "Invalid order ID."
            );

          }


          var orderId =
            Number(
              orderIdValue
            );


          if (
            !Number.isSafeInteger(
              orderId
            ) ||
            orderId <= 0
          ) {

            throw new Error(
              "Invalid order ID."
            );

          }


          /* ----------------------------------------------
             SESSION
             ---------------------------------------------- */

          var sessionResult =
            await window.supabaseClient
              .auth
              .getSession();


          if (
            sessionResult.error
          ) {

            throw sessionResult.error;

          }


          var session =
            sessionResult.data &&
            sessionResult.data.session;


          /* ----------------------------------------------
             LOGIN REQUIRED
             ---------------------------------------------- */

          if (
            !session ||
            !session.user
          ) {

            showMessage(
              "Please sign in to view this order.",
              "error"
            );


            contentElement.innerHTML = `

              <div class="confirmation-card">

                <div class="confirmation-actions">

                  <a
                    href="login.html?next=${encodeURIComponent(
                      "order-confirmation.html?order=" +
                      orderIdValue
                    )}"
                    class="confirmation-btn primary"
                  >
                    Login
                  </a>

                </div>

              </div>

            `;


            contentElement.hidden =
              false;


            return;

          }


          /* ==================================================
             GET CUSTOMER ORDER

             IMPORTANT:
             variant_id
             pack_size
             fulfillment_status

             are loaded from order_items.
             ================================================== */

          var orderResult =
            await window.supabaseClient

              .from(
                "orders"
              )

              .select(
                `

                id,

                user_id,

                customer_name,

                customer_phone,

                shipping_address,

                city,

                state,

                pincode,

                total_amount,

                payment_status,

                order_status,

                payment_method,

                created_at,

                order_items (

                  id,

                  product_id,

                  variant_id,

                  product_name,

                  pack_size,

                  price,

                  quantity,

                  fulfillment_status

                )

                `
              )

              .eq(
                "id",
                orderId
              )

              .eq(
                "user_id",
                session.user.id
              )

              .maybeSingle();


          /* ----------------------------------------------
             DATABASE ERROR
             ---------------------------------------------- */

          if (
            orderResult.error
          ) {

            throw orderResult.error;

          }


          /* ----------------------------------------------
             ORDER NOT FOUND / ACCESS DENIED
             ---------------------------------------------- */

          if (
            !orderResult.data
          ) {

            throw new Error(
              "Order not found or you do not have permission to view this order."
            );

          }


          console.log(
            "Brit.Tuna Order Confirmation:",
            orderResult.data
          );


          /* ----------------------------------------------
             RENDER
             ---------------------------------------------- */

          hideMessage();


          renderOrder(
            orderResult.data
          );


        }

        catch (error) {

          console.error(
            "Brit.Tuna Order Confirmation error:",
            error
          );


          contentElement.hidden =
            true;


          showMessage(

            error &&
            error.message

              ? error.message

              : "Unable to load this order.",

            "error"

          );

        }

      }


      /* ====================================================
         START
         ==================================================== */

      document.addEventListener(

        "DOMContentLoaded",

        loadOrder

      );


    })();

  </script>


</body>

</html>
