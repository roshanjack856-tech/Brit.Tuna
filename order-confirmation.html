<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Order Details | Brit.Tuna</title>

  <meta
    name="robots"
    content="noindex"
  >

  <meta
    name="theme-color"
    content="#1f5a3a"
  >

  <!-- Google Fonts -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap"
    rel="stylesheet"
  >

  <!-- Brit.Tuna CSS -->

  <link
    rel="stylesheet"
    href="style.css"
  >

  <link
    rel="stylesheet"
    href="responsive.css"
  >

  <style>

    /* ======================================================
       ORDER CONFIRMATION
       ====================================================== */

    .confirmation-wrap {
      max-width: 900px;
      margin: 0 auto;
    }


    .confirmation-message {
      padding: 18px;
      border-radius: 14px;
      background: #f7f4eb;
      color: #34423a;
      text-align: center;
      margin-bottom: 24px;
    }


    .confirmation-message.error {
      background: #fff0ed;
      color: #9c2f25;
    }


    .confirmation-message.success {
      background: #edf7f0;
      color: #1f5a3a;
    }


    .confirmation-card {
      background: #ffffff;
      border: 1px solid rgba(31, 90, 58, 0.12);
      border-radius: 20px;
      padding: 26px;
      box-shadow: 0 8px 30px rgba(25, 50, 35, 0.06);
      overflow: hidden;
    }


    /* ======================================================
       HEADER
       ====================================================== */

    .confirmation-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid #ecebe5;
    }


    .confirmation-top h2 {
      margin: 0 0 6px;
      color: #173d29;
      font-family: "Fraunces", serif;
      font-size: 1.5rem;
    }


    .confirmation-date {
      margin: 0;
      color: #6d746f;
      font-size: 0.9rem;
    }


    .confirmation-total {
      color: #1f5a3a;
      font-size: 1.35rem;
      font-weight: 700;
      white-space: nowrap;
    }


    /* ======================================================
       STATUS
       ====================================================== */

    .confirmation-statuses {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin: 20px 0;
    }


    .confirmation-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 12px;
      border-radius: 999px;
      background: #eef4ef;
      color: #1f5a3a;
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: capitalize;
    }


    .confirmation-badge.payment {
      background: #fff3df;
      color: #8a5a0a;
    }


    /* ======================================================
       COD NOTICE
       ====================================================== */

    .cod-order-notice {
      padding: 15px 17px;
      margin-bottom: 22px;
      border-radius: 12px;
      background: #edf7f0;
      color: #28563a;
      line-height: 1.6;
      font-size: 0.9rem;
    }


    .cod-order-notice strong {
      color: #1f5a3a;
    }


    /* ======================================================
       OLD TEST ORDER NOTICE
       ====================================================== */

    .test-order-notice {
      padding: 13px 15px;
      margin-bottom: 22px;
      border-radius: 12px;
      background: #fff8e8;
      color: #775410;
      line-height: 1.55;
      font-size: 0.86rem;
    }


    .test-order-notice strong {
      color: #614207;
    }


    /* ======================================================
       CUSTOMER INFO
       ====================================================== */

    .confirmation-section {
      margin-top: 25px;
    }


    .confirmation-section-title {
      margin: 0 0 15px;
      color: #173d29;
      font-family: "Fraunces", serif;
      font-size: 1.15rem;
    }


    .customer-grid {
      display: grid;
      grid-template-columns:
        repeat(
          2,
          minmax(0, 1fr)
        );
      gap: 15px;
    }


    .customer-info-box {
      padding: 14px;
      border-radius: 12px;
      background: #f8faf8;
    }


    .customer-info-label {
      display: block;
      color: #788078;
      font-size: 0.76rem;
      font-weight: 600;
      margin-bottom: 5px;
    }


    .customer-info-value {
      color: #29352e;
      font-weight: 700;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }


    .customer-info-box.full {
      grid-column: 1 / -1;
    }


    /* ======================================================
       ORDER ITEMS
       ====================================================== */

    .confirmation-items {
      margin: 0;
      padding: 0;
      list-style: none;
    }


    .confirmation-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 17px 0;
      border-bottom: 1px dashed #dedfd9;
    }


    .confirmation-item:last-child {
      border-bottom: 0;
    }


    /* ======================================================
       PRODUCT IMAGE + PRODUCT INFORMATION
       ====================================================== */

    .confirmation-product {
      display: flex;
      align-items: flex-start;
      gap: 15px;
      flex: 1;
      min-width: 0;
    }


    .confirmation-product-image-link {
      display: block;
      width: 95px;
      height: 95px;
      flex: 0 0 95px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #ece7da;
      background: #f7f4eb;
      text-decoration: none;
    }


    .confirmation-product-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.25s ease;
    }


    .confirmation-product-image-link:hover
    .confirmation-product-image {
      transform: scale(1.05);
    }


    .confirmation-item-left {
      flex: 1;
      min-width: 0;
    }


    .confirmation-item-name {
      display: inline-block;
      margin-bottom: 6px;
      color: #29352e;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: break-word;
    }


    a.confirmation-item-name:hover {
      color: #1f5a3a;
      text-decoration: underline;
    }


    .confirmation-item-details {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 8px;
    }


    .item-detail {
      display: inline-flex;
      align-items: center;
      padding: 5px 9px;
      border-radius: 8px;
      background: #f3f4f1;
      color: #626b65;
      font-size: 0.77rem;
      font-weight: 600;
    }


    .item-detail.pack {
      background: #edf5ef;
      color: #1f5a3a;
      font-weight: 700;
    }


    .confirmation-item-price {
      color: #1f5a3a;
      font-weight: 700;
      white-space: nowrap;
      text-align: right;
    }


    .unit-price {
      display: block;
      margin-top: 4px;
      color: #788078;
      font-size: 0.73rem;
      font-weight: 500;
    }


    /* ======================================================
       SELLER STATUS
       ====================================================== */

    .seller-status-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      margin-top: 10px;
    }


    .seller-status-label {
      color: #6d746f;
      font-size: 0.78rem;
      font-weight: 600;
    }


    .seller-status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.76rem;
      line-height: 1;
      font-weight: 700;
      text-transform: capitalize;
    }


    .seller-status.pending {
      background: #fff3df;
      color: #8a5a0a;
    }


    .seller-status.processing {
      background: #e8f1ff;
      color: #245ea8;
    }


    .seller-status.shipped {
      background: #eee8ff;
      color: #6340a5;
    }


    .seller-status.delivered {
      background: #e8f7ec;
      color: #18723a;
    }


    .seller-status.cancelled {
      background: #fff0ed;
      color: #a52f25;
    }


    .seller-status.unknown {
      background: #f1f2f1;
      color: #58625c;
    }


    /* ======================================================
       STATUS HELP
       ====================================================== */

    .status-help {
      margin-top: 15px;
      padding: 12px 14px;
      border-radius: 11px;
      background: #f8faf8;
      color: #66716a;
      font-size: 0.8rem;
      line-height: 1.6;
    }


    .status-help strong {
      color: #1f5a3a;
    }


    /* ======================================================
       SUMMARY
       ====================================================== */

    .order-summary {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid #ecebe5;
    }


    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 8px;
      color: #59635d;
    }


    .summary-row.total {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #ecebe5;
      color: #173d29;
      font-size: 1.15rem;
      font-weight: 700;
    }


    .summary-row.total strong {
      color: #1f5a3a;
    }


    /* ======================================================
       ACTIONS
       ====================================================== */

    .confirmation-actions {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 25px;
    }


    .confirmation-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 17px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      transition: 0.2s ease;
    }


    .confirmation-btn.primary {
      background: #1f5a3a;
      color: #ffffff;
    }


    .confirmation-btn.secondary {
      border: 1px solid rgba(31, 90, 58, 0.22);
      background: #ffffff;
      color: #1f5a3a;
    }


    .confirmation-btn:hover {
      transform: translateY(-1px);
      opacity: 0.92;
    }


    /* ======================================================
       MOBILE
       ====================================================== */

    @media (max-width: 650px) {

      .confirmation-card {
        padding: 18px;
      }


      .confirmation-top {
        flex-direction: column;
        gap: 10px;
      }


      .customer-grid {
        grid-template-columns: 1fr;
      }


      .customer-info-box.full {
        grid-column: auto;
      }


      .confirmation-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }


      .confirmation-product {
        width: 100%;
      }


      .confirmation-product-image-link {
        width: 78px;
        height: 78px;
        flex-basis: 78px;
      }


      .confirmation-item-price {
        margin-left: 93px;
        text-align: left;
        white-space: normal;
      }


      .confirmation-actions {
        flex-direction: column;
      }


      .confirmation-btn {
        width: 100%;
      }

    }


    @media (max-width: 380px) {

      .confirmation-product {
        gap: 11px;
      }


      .confirmation-product-image-link {
        width: 68px;
        height: 68px;
        flex-basis: 68px;
      }


      .confirmation-item-price {
        margin-left: 79px;
      }

    }

  </style>

</head>


<body data-page="order-confirmation">


  <!-- HEADER -->

  <div id="site-header"></div>


  <!-- MAIN -->

  <main id="main">


    <section class="page-hero">

      <div class="container">

        <h1>
          Order Details
        </h1>

        <p>
          Review your Brit.Tuna order and product fulfillment status.
        </p>

      </div>

    </section>


    <section class="container page-body">

      <div class="confirmation-wrap">


        <div
          id="confirmation-message"
          class="confirmation-message"
          role="status"
          aria-live="polite"
        >
          Loading your order...
        </div>


        <div
          id="confirmation-content"
          hidden
        ></div>


      </div>

    </section>


  </main>


  <!-- FOOTER -->

  <div id="site-footer"></div>


  <!-- =====================================================
       BRIT.TUNA JAVASCRIPT
  ====================================================== -->

  <!-- Supabase Library -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <!-- Configuration -->

  <script src="config.js"></script>


  <!-- Supabase Client -->

  <script src="supabase.js"></script>


  <!-- Products -->

  <script src="products.js"></script>


  <!-- Cart -->

  <script src="cart.js"></script>


  <!-- Wishlist -->

  <script src="wishlist.js"></script>


  <!-- Shared Header / Footer / Authentication -->

  <script src="script.js"></script>


  <!-- ORDER CONFIRMATION LOGIC -->

  <script>

    (function () {

      "use strict";


      /* ====================================================
         ELEMENTS
         ==================================================== */

      var messageElement =
        document.getElementById(
          "confirmation-message"
        );


      var contentElement =
        document.getElementById(
          "confirmation-content"
        );


      var productImageMap =
        {};


      /* ====================================================
         ESCAPE HTML
         ==================================================== */

      function escapeHtml(value) {

        return String(
          value == null
            ? ""
            : value
        )

          .replace(
            /&/g,
            "&amp;"
          )

          .replace(
            /</g,
            "&lt;"
          )

          .replace(
            />/g,
            "&gt;"
          )

          .replace(
            /"/g,
            "&quot;"
          )

          .replace(
            /'/g,
            "&#039;"
          );

      }


      /* ====================================================
         MONEY
         ==================================================== */

      function formatMoney(value) {

        var amount =
          Number(
            value || 0
          );


        return new Intl.NumberFormat(
          "en-IN",
          {

            style:
              "currency",

            currency:
              "INR",

            maximumFractionDigits:
              2

          }

        ).format(
          amount
        );

      }


      /* ====================================================
         DATE
         ==================================================== */

      function formatDate(value) {

        if (!value) {

          return "";

        }


        var date =
          new Date(
            value
          );


        if (
          Number.isNaN(
            date.getTime()
          )
        ) {

          return "";

        }


        return new Intl.DateTimeFormat(
          "en-IN",
          {

            day:
              "2-digit",

            month:
              "short",

            year:
              "numeric",

            hour:
              "2-digit",

            minute:
              "2-digit"

          }

        ).format(
          date
        );

      }


      /* ====================================================
         MESSAGE
         ==================================================== */

      function showMessage(
        text,
        type
      ) {

        if (!messageElement) {

          return;

        }


        messageElement.textContent =
          text;


        messageElement.className =
          "confirmation-message";


        if (type) {

          messageElement.classList.add(
            type
          );

        }


        messageElement.hidden =
          false;

      }


      function hideMessage() {

        if (messageElement) {

          messageElement.hidden =
            true;

        }

      }


      /* ====================================================
         PAYMENT METHOD LABEL
         ==================================================== */

      function paymentMethodLabel(value) {

        var method =
          String(
            value || ""
          )
            .trim()
            .toLowerCase();


        if (
          method ===
          "cod"
        ) {

          return "Cash on Delivery (COD)";

        }


        if (
          method ===
          "test_order"
        ) {

          return "Test Order";

        }


        if (!method) {

          return "-";

        }


        return value;

      }


      /* ====================================================
         PAYMENT NOTICE
         ==================================================== */

      function paymentNoticeHtml(
        order
      ) {

        var paymentMethod =
          String(
            order.payment_method || ""
          )
            .trim()
            .toLowerCase();


        if (
          paymentMethod ===
          "cod"
        ) {

          return `

            <div class="cod-order-notice">

              <strong>
                Order placed successfully!
              </strong>

              <br>

              Your payment method is

              <strong>
                Cash on Delivery (COD).
              </strong>

              Please pay

              <strong>
                ${escapeHtml(
                  formatMoney(
                    order.total_amount
                  )
                )}
              </strong>

              when your order is delivered.

            </div>

          `;

        }


        /*
          Keep support for orders created before
          COD was enabled.
        */

        if (
          paymentMethod ===
          "test_order"
        ) {

          return `

            <div class="test-order-notice">

              <strong>
                Demo / Test Order:
              </strong>

              This is an older test order.

              No real online payment was processed.

            </div>

          `;

        }


        return "";

      }


      /* ====================================================
         PLACEHOLDER IMAGE
         ==================================================== */

      function placeholderImage() {

        return (
          "data:image/svg+xml;charset=UTF-8," +
          encodeURIComponent(
            `
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="400"
              height="400"
              viewBox="0 0 400 400"
            >
              <rect
                width="400"
                height="400"
                fill="#f7f4eb"
              />

              <circle
                cx="200"
                cy="155"
                r="55"
                fill="#dfe9e1"
              />

              <path
                d="M100 310 L170 220 L215 265 L255 220 L320 310 Z"
                fill="#c9d9cd"
              />

              <text
                x="200"
                y="360"
                text-anchor="middle"
                font-family="Arial, sans-serif"
                font-size="24"
                fill="#1f5a3a"
              >
                Brit.Tuna
              </text>

            </svg>
            `
          )
        );

      }


      /* ====================================================
         PRODUCT DETAILS URL
         ==================================================== */

      function productUrl(productId) {

        var id =
          Number(
            productId
          );


        if (
          !Number.isInteger(id) ||
          id <= 0
        ) {

          return "shop.html";

        }


        return (
          "product-details.html?id=" +
          encodeURIComponent(
            String(id)
          )
        );

      }


      /* ====================================================
         GET PRODUCT IMAGE
         ==================================================== */

      function getProductImage(
        productId
      ) {

        var key =
          String(
            productId || ""
          );


        return (
          productImageMap[key] ||
          placeholderImage()
        );

      }


      /* ====================================================
         LOAD PRODUCT IMAGES
         ==================================================== */

      async function loadProductImages(
        items
      ) {

        productImageMap =
          {};


        if (
          !Array.isArray(items) ||
          items.length === 0
        ) {

          return;

        }


        var productIds =
          [];


        items.forEach(
          function (item) {

            var id =
              Number(
                item.product_id
              );


            if (
              Number.isInteger(id) &&
              id > 0 &&
              !productIds.includes(id)
            ) {

              productIds.push(
                id
              );

            }

          }
        );


        if (
          productIds.length === 0
        ) {

          return;

        }


        /* PRODUCTS IMAGE FALLBACK */

        try {

          var productResult =
            await window.supabaseClient

              .from(
                "products"
              )

              .select(
                "id, image_url"
              )

              .in(
                "id",
                productIds
              );


          if (
            productResult.error
          ) {

            console.warn(
              "Brit.Tuna: Product fallback images could not be loaded.",
              productResult.error
            );

          } else {

            (
              productResult.data ||
              []
            ).forEach(
              function (product) {

                if (
                  product &&
                  product.image_url
                ) {

                  productImageMap[
                    String(
                      product.id
                    )
                  ] =
                    product.image_url;

                }

              }
            );

          }

        } catch (error) {

          console.warn(
            "Brit.Tuna: Product fallback image loading failed.",
            error
          );

        }


        /* PRODUCT_IMAGES */

        try {

          var imageResult =
            await window.supabaseClient

              .from(
                "product_images"
              )

              .select(
                `
                id,
                product_id,
                image_url,
                sort_order,
                is_primary
                `
              )

              .in(
                "product_id",
                productIds
              )

              .order(
                "sort_order",
                {
                  ascending:
                    true
                }
              );


          if (
            imageResult.error
          ) {

            console.warn(
              "Brit.Tuna: Product images could not be loaded.",
              imageResult.error
            );

            return;

          }


          var groupedImages =
            {};


          (
            imageResult.data ||
            []
          ).forEach(
            function (image) {

              if (
                !image ||
                !image.product_id
              ) {

                return;

              }


              var key =
                String(
                  image.product_id
                );


              if (
                !groupedImages[key]
              ) {

                groupedImages[key] =
                  [];

              }


              groupedImages[key].push(
                image
              );

            }
          );


          Object.keys(
            groupedImages
          ).forEach(
            function (productId) {

              var images =
                groupedImages[
                  productId
                ];


              images.sort(
                function (a, b) {

                  if (
                    a.is_primary &&
                    !b.is_primary
                  ) {

                    return -1;

                  }


                  if (
                    !a.is_primary &&
                    b.is_primary
                  ) {

                    return 1;

                  }


                  return (
                    Number(
                      a.sort_order || 0
                    ) -
                    Number(
                      b.sort_order || 0
                    )
                  );

                }
              );


              var selectedImage =
                images.find(
                  function (image) {

                    return (
                      image &&
                      image.image_url
                    );

                  }
                );


              if (
                selectedImage &&
                selectedImage.image_url
              ) {

                productImageMap[
                  productId
                ] =
                  selectedImage.image_url;

              }

            }
          );


        } catch (error) {

          console.warn(
            "Brit.Tuna: Product image loading failed.",
            error
          );

        }

      }


      /* ====================================================
         SELLER FULFILLMENT
         ==================================================== */

      function normalizeFulfillmentStatus(
        status
      ) {

        var value =
          String(
            status || "pending"
          )
            .trim()
            .toLowerCase();


        var allowed = [

          "pending",

          "processing",

          "shipped",

          "delivered",

          "cancelled"

        ];


        if (
          !allowed.includes(
            value
          )
        ) {

          return "unknown";

        }


        return value;

      }


      function fulfillmentStatusHtml(
        status
      ) {

        var safeStatus =
          normalizeFulfillmentStatus(
            status
          );


        return `

          <div class="seller-status-row">

            <span class="seller-status-label">
              Seller Status:
            </span>

            <span
              class="seller-status ${escapeHtml(
                safeStatus
              )}"
            >

              ${escapeHtml(
                safeStatus
              )}

            </span>

          </div>

        `;

      }


      /* ====================================================
         PRODUCT DETAILS
         ==================================================== */

      function productDetailsHtml(
        item
      ) {

        var html =
          '<div class="confirmation-item-details">';


        if (
          item.product_id
        ) {

          html += `

            <span class="item-detail">

              Product ID:
              ${escapeHtml(
                item.product_id
              )}

            </span>

          `;

        }


        if (
          item.pack_size
        ) {

          html += `

            <span class="item-detail pack">

              Pack:
              ${escapeHtml(
                item.pack_size
              )}

            </span>

          `;

        }


        if (
          item.variant_id
        ) {

          html += `

            <span class="item-detail">

              Variant ID:
              ${escapeHtml(
                item.variant_id
              )}

            </span>

          `;

        }


        html +=
          "</div>";


        return html;

      }


      /* ====================================================
         RENDER ORDER ITEMS
         ==================================================== */

      function renderItems(
        items
      ) {

        if (
          !Array.isArray(items) ||
          items.length === 0
        ) {

          return `

            <li class="confirmation-item">

              <span class="confirmation-item-name">
                Order items unavailable
              </span>

            </li>

          `;

        }


        return items.map(

          function (item) {

            var quantity =
              Number(
                item.quantity || 1
              );


            var price =
              Number(
                item.price || 0
              );


            var lineTotal =
              price *
              quantity;


            var imageUrl =
              getProductImage(
                item.product_id
              );


            var detailsUrl =
              productUrl(
                item.product_id
              );


            return `

              <li class="confirmation-item">


                <div class="confirmation-product">


                  <a
                    class="confirmation-product-image-link"
                    href="${escapeHtml(
                      detailsUrl
                    )}"
                    aria-label="View ${escapeHtml(
                      item.product_name ||
                      "product"
                    )}"
                  >

                    <img
                      class="confirmation-product-image"
                      src="${escapeHtml(
                        imageUrl
                      )}"
                      alt="${escapeHtml(
                        item.product_name ||
                        "Brit.Tuna product"
                      )}"
                      loading="lazy"
                      data-fallback="ready"
                    >

                  </a>


                  <div class="confirmation-item-left">


                    <a
                      class="confirmation-item-name"
                      href="${escapeHtml(
                        detailsUrl
                      )}"
                    >

                      ${escapeHtml(
                        item.product_name ||
                        "Product"
                      )}

                      × ${escapeHtml(
                        quantity
                      )}

                    </a>


                    ${productDetailsHtml(
                      item
                    )}


                    ${fulfillmentStatusHtml(
                      item.fulfillment_status
                    )}


                  </div>


                </div>


                <div class="confirmation-item-price">

                  ${formatMoney(
                    lineTotal
                  )}

                  <span class="unit-price">

                    ${formatMoney(
                      price
                    )}
                    each

                  </span>

                </div>


              </li>

            `;

          }

        ).join("");

      }


      /* ====================================================
         ADDRESS
         ==================================================== */

      function buildAddress(
        order
      ) {

        var parts = [

          order.shipping_address,

          order.city,

          order.state,

          order.pincode

        ].filter(

          function (value) {

            return Boolean(
              value
            );

          }

        );


        return parts.join(
          ", "
        );

      }


      /* ====================================================
         ATTACH IMAGE ERROR FALLBACK
         ==================================================== */

      function attachImageFallbacks() {

        contentElement
          .querySelectorAll(
            ".confirmation-product-image"
          )
          .forEach(
            function (image) {

              image.addEventListener(
                "error",
                function () {

                  if (
                    image.dataset.fallback ===
                    "done"
                  ) {

                    return;

                  }


                  image.dataset.fallback =
                    "done";


                  image.src =
                    placeholderImage();

                }
              );

            }
          );

      }


      /* ====================================================
         RENDER ORDER
         ==================================================== */

      function renderOrder(
        order
      ) {

        var orderStatus =
          order.order_status ||
          "pending";


        var paymentStatus =
          order.payment_status ||
          "pending";


        var address =
          buildAddress(
            order
          );


        var items =
          Array.isArray(
            order.order_items
          )

            ? order.order_items

            : [];


        contentElement.innerHTML = `

          <article class="confirmation-card">


            <!-- HEADER -->

            <div class="confirmation-top">

              <div>

                <h2>

                  Order #${escapeHtml(
                    order.id
                  )}

                </h2>


                <p class="confirmation-date">

                  ${escapeHtml(
                    formatDate(
                      order.created_at
                    )
                  )}

                </p>

              </div>


              <div class="confirmation-total">

                ${formatMoney(
                  order.total_amount
                )}

              </div>

            </div>


            <!-- OVERALL STATUS -->

            <div class="confirmation-statuses">

              <span class="confirmation-badge">

                Order:
                ${escapeHtml(
                  orderStatus
                )}

              </span>


              <span class="confirmation-badge payment">

                Payment:
                ${escapeHtml(
                  paymentStatus
                )}

              </span>

            </div>


            <!-- PAYMENT / COD NOTICE -->

            ${paymentNoticeHtml(
              order
            )}


            <!-- CUSTOMER -->

            <section class="confirmation-section">

              <h3 class="confirmation-section-title">
                Customer & Delivery
              </h3>


              <div class="customer-grid">


                <div class="customer-info-box">

                  <span class="customer-info-label">
                    Customer Name
                  </span>

                  <div class="customer-info-value">

                    ${escapeHtml(
                      order.customer_name ||
                      "-"
                    )}

                  </div>

                </div>


                <div class="customer-info-box">

                  <span class="customer-info-label">
                    Phone
                  </span>

                  <div class="customer-info-value">

                    ${escapeHtml(
                      order.customer_phone ||
                      "-"
                    )}

                  </div>

                </div>


                <div class="customer-info-box">

                  <span class="customer-info-label">
                    Payment Method
                  </span>

                  <div class="customer-info-value">

                    ${escapeHtml(
                      paymentMethodLabel(
                        order.payment_method
                      )
                    )}

                  </div>

                </div>


                <div class="customer-info-box">

                  <span class="customer-info-label">
                    Payment Status
                  </span>

                  <div class="customer-info-value">

                    ${escapeHtml(
                      paymentStatus
                    )}

                  </div>

                </div>


                <div class="customer-info-box">

                  <span class="customer-info-label">
                    PIN Code
                  </span>

                  <div class="customer-info-value">

                    ${escapeHtml(
                      order.pincode ||
                      "-"
                    )}

                  </div>

                </div>


                <div class="customer-info-box full">

                  <span class="customer-info-label">
                    Delivery Address
                  </span>

                  <div class="customer-info-value">

                    ${escapeHtml(
                      address ||
                      "-"
                    )}

                  </div>

                </div>


              </div>

            </section>


            <!-- PRODUCTS -->

            <section class="confirmation-section">

              <h3 class="confirmation-section-title">
                Products
              </h3>


              <ul class="confirmation-items">

                ${renderItems(
                  items
                )}

              </ul>


              <div class="status-help">

                <strong>
                  Seller Status
                </strong>

                is the fulfillment status of each individual
                product.

                A seller can move their item through

                <strong>
                  Pending → Processing → Shipped → Delivered
                </strong>

                or cancel their own item where allowed.

                <br><br>

                The

                <strong>
                  Overall Order Status
                </strong>

                is separate and is managed by Brit.Tuna Admin.

              </div>

            </section>


            <!-- TOTAL -->

            <div class="order-summary">

              <div class="summary-row">

                <span>
                  Payment Method
                </span>

                <strong>

                  ${escapeHtml(
                    paymentMethodLabel(
                      order.payment_method
                    )
                  )}

                </strong>

              </div>


              <div class="summary-row">

                <span>
                  Payment Status
                </span>

                <strong>

                  ${escapeHtml(
                    paymentStatus
                  )}

                </strong>

              </div>


              <div class="summary-row total">

                <span>
                  Order Total
                </span>

                <strong>

                  ${formatMoney(
                    order.total_amount
                  )}

                </strong>

              </div>

            </div>


            <!-- ACTIONS -->

            <div class="confirmation-actions">

              <a
                href="orders.html"
                class="confirmation-btn secondary"
              >
                My Orders
              </a>


              <a
                href="shop.html"
                class="confirmation-btn primary"
              >
                Continue Shopping
              </a>

            </div>


          </article>

        `;


        contentElement.hidden =
          false;


        attachImageFallbacks();

      }


      /* ====================================================
         LOAD ORDER
         ==================================================== */

      async function loadOrder() {

        try {


          showMessage(
            "Loading your order..."
          );


          contentElement.hidden =
            true;


          /* SUPABASE */

          if (
            !window.supabaseClient
          ) {

            throw new Error(
              "Supabase connection is not available."
            );

          }


          /* ORDER ID FROM URL */

          var params =
            new URLSearchParams(
              window.location.search
            );


          var orderIdValue =
            params.get(
              "order"
            );


          if (
            !orderIdValue
          ) {

            throw new Error(
              "Order ID is missing."
            );

          }


          if (
            !/^\d+$/.test(
              orderIdValue
            )
          ) {

            throw new Error(
              "Invalid order ID."
            );

          }


          var orderId =
            Number(
              orderIdValue
            );


          if (
            !Number.isSafeInteger(
              orderId
            ) ||
            orderId <= 0
          ) {

            throw new Error(
              "Invalid order ID."
            );

          }


          /* SESSION */

          var sessionResult =
            await window.supabaseClient
              .auth
              .getSession();


          if (
            sessionResult.error
          ) {

            throw sessionResult.error;

          }


          var session =
            sessionResult.data &&
            sessionResult.data.session;


          /* LOGIN REQUIRED */

          if (
            !session ||
            !session.user
          ) {

            showMessage(
              "Please sign in to view this order.",
              "error"
            );


            contentElement.innerHTML = `

              <div class="confirmation-card">

                <div class="confirmation-actions">

                  <a
                    href="login.html?next=${encodeURIComponent(
                      "order-confirmation.html?order=" +
                      orderIdValue
                    )}"
                    class="confirmation-btn primary"
                  >
                    Login
                  </a>

                </div>

              </div>

            `;


            contentElement.hidden =
              false;


            return;

          }


          /* ==================================================
             GET CUSTOMER ORDER

             Order ID + logged-in user ID
             ================================================== */

          var orderResult =
            await window.supabaseClient

              .from(
                "orders"
              )

              .select(
                `

                id,

                user_id,

                customer_name,

                customer_phone,

                shipping_address,

                city,

                state,

                pincode,

                total_amount,

                payment_status,

                order_status,

                payment_method,

                created_at,

                order_items (

                  id,

                  product_id,

                  seller_id,

                  variant_id,

                  product_name,

                  pack_size,

                  price,

                  quantity,

                  fulfillment_status

                )

                `
              )

              .eq(
                "id",
                orderId
              )

              .eq(
                "user_id",
                session.user.id
              )

              .maybeSingle();


          if (
            orderResult.error
          ) {

            throw orderResult.error;

          }


          if (
            !orderResult.data
          ) {

            throw new Error(
              "Order not found or you do not have permission to view this order."
            );

          }


          var order =
            orderResult.data;


          console.log(
            "Brit.Tuna Order Confirmation:",
            order
          );


          /* LOAD PRODUCT IMAGES */

          await loadProductImages(
            Array.isArray(
              order.order_items
            )

              ? order.order_items

              : []
          );


          console.log(
            "Brit.Tuna Order Product Images:",
            productImageMap
          );


          /* RENDER */

          hideMessage();


          renderOrder(
            order
          );


        } catch (error) {

          console.error(
            "Brit.Tuna Order Confirmation error:",
            error
          );


          contentElement.hidden =
            true;


          showMessage(

            error &&
            error.message

              ? error.message

              : "Unable to load this order.",

            "error"

          );

        }

      }


      /* ====================================================
         START
         ==================================================== */

      document.addEventListener(

        "DOMContentLoaded",

        loadOrder

      );


    })();

  </script>


</body>

</html>
