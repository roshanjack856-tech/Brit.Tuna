<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#7a1f2b"
  >


  <!-- =====================================================
       GOOGLE FONTS
  ====================================================== -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap"

<body data-page="product-details">


  <!-- =====================================================
       SHARED HEADER
  ====================================================== -->

  <div id="site-header"></div>


  <!-- =====================================================
       MAIN CONTENT
  ====================================================== -->

  <main id="main">

    <div class="container page-body">


      <!-- =================================================
           PRODUCT DETAILS

           Product is loaded using URL:

           product-details.html?slug=raw-peanuts
      ================================================== -->

      <div id="product-detail">

        <p class="loading">
          Loading product…
        </p>

      </div>


      <!-- =================================================
           RELATED PRODUCTS
      ================================================== -->

      <section style="margin-top:48px">

        <div class="section-head">

          <h2 class="section-title">
            Related products
          </h2>

          <a
            class="btn btn-outline"
            href="shop.html"
          >
            View all
          </a>

        </div>


        <div
          class="product-grid"
          id="related-grid"
        ></div>

      </section>


    </div>

  </main>


  <!-- =====================================================
       SHARED FOOTER
  ====================================================== -->

  <div id="site-footer"></div>


  <!-- =====================================================

====================================================== -->
