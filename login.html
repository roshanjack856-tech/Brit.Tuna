<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Sign In | Brit.Tuna</title>

  <meta
    name="robots"
    content="noindex"
  >

  <meta
    name="theme-color"
    content="#1f5a3a"
  >


  <!-- GOOGLE FONTS -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap"
    rel="stylesheet"
  >


  <!-- WEBSITE CSS -->

  <link
    rel="stylesheet"
    href="style.css"
  >

  <link
    rel="stylesheet"
    href="responsive.css"
  >


  <!-- LOGIN PAGE STYLE -->

  <style>

    /* Clean, centred sign-in layout (header, footer, photo
       background and hero are hidden on this page only). */

    body[data-page="login"] {
      background: #f7f9f6;
      min-height: 100vh;
    }

    body[data-page="login"] .bg-slides,
    body[data-page="login"] #site-header,
    body[data-page="login"] #site-footer,
    body[data-page="login"] .topbar,
    body[data-page="login"] .wa-float {
      display: none !important;
    }

    .login-page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 28px 16px 48px;
    }

    .login-shell {
      width: 100%;
      max-width: 448px;
      text-align: center;
      animation: bt-fade-up 0.5s ease both;
    }

    .login-logo {
      display: inline-block;
      font-family: "Fraunces", Georgia, serif;
      font-weight: 700;
      font-size: 2rem;
      color: #1f5a3a;
      text-decoration: none;
      letter-spacing: -0.01em;
      margin-bottom: 34px;
    }

    .login-logo span {
      color: #d63b2f;
    }

    .login-shell h1 {
      font-family: "DM Sans", system-ui, sans-serif;
      font-size: 1.9rem;
      font-weight: 700;
      color: #1b1f1d;
      margin: 0 0 10px;
    }

    .login-sub {
      color: #6b7280;
      margin: 0 0 32px;
      font-size: 1rem;
    }

    .google-login-button {
      width: 100%;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 12px 18px;
      background: #fff;
      color: #202124;
      border: 1px solid #eceff1;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(20, 30, 25, 0.08);
      font-family: "DM Sans", sans-serif;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: box-shadow 0.2s ease, transform 0.15s ease;
    }

    .google-login-button:hover {
      box-shadow: 0 4px 14px rgba(20, 30, 25, 0.14);
    }

    .google-login-button:active {
      transform: scale(0.99);
    }

    .google-login-button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .google-icon {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 26px 0 30px;
      color: #9aa1a9;
      font-size: 0.95rem;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: "";
      flex: 1;
      border-top: 1px dashed #c4cad0;
    }

    #login-form {
      text-align: left;
    }

    .login-field {
      margin-bottom: 20px;
    }

    .login-field label {
      display: block;
      font-size: 1rem;
      font-weight: 500;
      color: #1b1f1d;
      margin-bottom: 9px;
    }

    .login-field input {
      width: 100%;
      height: 50px;
      padding: 0 16px;
      background: #fff;
      border: 1px solid #e3e7ea;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(20, 30, 25, 0.06);
      font-family: "DM Sans", sans-serif;
      font-size: 1rem;
      color: #1b1f1d;
      box-sizing: border-box;
    }

    .login-field input::placeholder {
      color: #9aa1a9;
    }

    .login-field input:focus {
      outline: 0;
      border-color: #1f5a3a;
      box-shadow: 0 0 0 4px rgba(31, 90, 58, 0.14);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 52px;
    }

    .password-toggle {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      background: none;
      border: 0;
      border-radius: 8px;
      color: #8a929a;
      cursor: pointer;
    }

    .password-toggle:hover {
      color: #1f5a3a;
      background: #eef5f0;
    }

    .password-toggle svg {
      width: 20px;
      height: 20px;
    }

    #login-button {
      width: 100%;
      height: 50px;
      margin-top: 6px;
      border: 0;
      border-radius: 8px;
      background: #1f5a3a;
      color: #fff;
      font-family: "DM Sans", sans-serif;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(31, 90, 58, 0.28);
      transition: background 0.2s ease, transform 0.15s ease;
    }

    #login-button:hover:not(:disabled) {
      background: #174a2f;
    }

    #login-button:active:not(:disabled) {
      transform: scale(0.99);
    }

    #login-button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    #login-message {
      margin: 16px 0 0;
      text-align: center;
      font-size: 0.95rem;
      color: #b52d22;
      min-height: 1.2em;
    }

    .login-footer {
      margin-top: 22px;
      color: #6b7280;
    }

    .login-footer a {
      color: #1f5a3a;
      font-weight: 700;
      text-decoration: none;
    }

    .login-footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .login-page { padding-top: 20px; }
      .login-logo { margin-bottom: 26px; }
      .login-shell h1 { font-size: 1.6rem; }
    }

  </style>

</head>


<body data-page="login">


  <!-- WEBSITE HEADER (hidden on this page by CSS; kept so site scripts still work) -->

  <div id="site-header"></div>


  <main id="main" class="login-page">

    <div class="login-shell">

      <a class="login-logo" href="index.html" aria-label="Brit.Tuna home">
        Brit<span>.</span>Tuna
      </a>

      <h1>Welcome back</h1>

      <p class="login-sub">Login to manage your account.</p>


      <!-- GOOGLE LOGIN -->

      <button
        type="button"
        id="google-login-button"
        class="google-login-button"
      >

        <svg
              class="google-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >

              <path
                fill="#4285F4"
                d="M21.35 12.27c0-.79-.07-1.55-.2-2.27H12v4.3h5.23a4.47 4.47 0 0 1-1.94 2.93v2.79h3.14c1.84-1.69 2.92-4.18 2.92-7.75z"
              />

              <path
                fill="#34A853"
                d="M12 21.75c2.63 0 4.84-.87 6.45-2.36l-3.14-2.43c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.51A9.75 9.75 0 0 0 12 21.75z"
              />

              <path
                fill="#FBBC05"
                d="M6.54 13.85A5.86 5.86 0 0 1 6.23 12c0-.64.11-1.27.31-1.85V7.64H3.3A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.06 1.05 4.36l3.24-2.51z"
              />

              <path
                fill="#EA4335"
                d="M12 6.12c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.83 3.22 14.63 2.25 12 2.25A9.75 9.75 0 0 0 3.3 7.64l3.24 2.51C7.31 7.84 9.46 6.12 12 6.12z"
              />

            </svg>

        <span id="google-button-text">
          Continue with Google
        </span>

      </button>


      <div class="auth-divider">
        <span>or</span>
      </div>


      <!-- EMAIL LOGIN FORM -->

      <form id="login-form" novalidate>

        <div class="login-field">

          <label for="email">Email Address</label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="john.doe@example.com"
            autocomplete="email"
            required
          >

        </div>

        <div class="login-field">

          <label for="password">Password</label>

          <div class="password-wrap">

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="password-toggle"
              id="password-toggle"
              aria-label="Show password"
              aria-pressed="false"
            >

              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path id="eye-open" d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
                <circle id="eye-pupil" cx="12" cy="12" r="3"/>
                <path id="eye-slash" d="M3 3l18 18" style="display:none"/>
              </svg>

            </button>

          </div>

        </div>

        <button
          type="submit"
          id="login-button"
          class="btn btn-primary"
        >
          Sign In
        </button>

      </form>


      <!-- LOGIN / GOOGLE MESSAGE -->

      <p
        id="login-message"
        role="status"
        aria-live="polite"
      ></p>


      <p class="login-footer">
        Don't have an account yet?
        <a href="register.html">Create New Account</a>
      </p>

    </div>

  </main>


  <!-- FOOTER -->

  <div id="site-footer"></div>



  <!-- ==========================================
       1. SUPABASE LIBRARY
  =========================================== -->
<!-- ==========================================
     1. SUPABASE LIBRARY
=========================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- ==========================================
     2. BRIT.TUNA CONFIG
=========================================== -->

<script src="config.js"></script>


<!-- ==========================================
     3. CREATE SUPABASE CLIENT
=========================================== -->

<script src="supabase.js"></script>


<!-- ==========================================
     4. PRODUCTS
=========================================== -->

<script src="products.js"></script>


<!-- ==========================================
     5. CART
=========================================== -->

<script src="cart.js"></script>


<!-- ==========================================
     6. WEBSITE SCRIPT
=========================================== -->

<script src="script.js"></script>


<!-- ==========================================
     7. CUSTOMER LOGIN
=========================================== -->

<script>
  'use strict';

  const loginForm =
    document.getElementById('login-form');

  const loginMessage =
    document.getElementById('login-message');

  const loginButton =
    document.getElementById('login-button');

  const googleLoginButton =
    document.getElementById('google-login-button');

  const googleButtonText =
    document.getElementById('google-button-text');


  /* ==========================================
     GET PAGE AFTER LOGIN
  ========================================== */

  function getAfterLoginPage() {

    try {

      const savedPage =
        window.localStorage.getItem(
          'britTunaAfterLogin'
        );

      if (savedPage) {
        return savedPage;
      }

    } catch (error) {

      console.error(
        'Brit.Tuna: Could not read after-login page.',
        error
      );

    }

    return 'account.html';
  }


  /* ==========================================
     FINISH LOGIN

     If customer tried Add to Cart:
     - restore product
     - go to cart

     Normal login:
     - go to account
  ========================================== */

  async function finishLogin() {

    loginMessage.textContent =
      'Login successful! Redirecting...';


    try {

      if (
        window.BTCart &&
        typeof window.BTCart.restorePendingAction === 'function'
      ) {

        await window.BTCart.restorePendingAction();

      }

    } catch (error) {

      console.error(
        'Brit.Tuna: Could not restore pending cart action.',
        error
      );

    }


    const nextPage =
      getAfterLoginPage();


    try {

      window.localStorage.removeItem(
        'britTunaAfterLogin'
      );

    } catch (error) {
      // Ignore localStorage cleanup error
    }


    window.location.href =
      nextPage;
  }


  /* ==========================================
     ALREADY LOGGED IN

     This is especially important after
     Google OAuth redirects back to login.html.
  ========================================== */

  async function checkExistingLogin() {

    if (!window.supabaseClient) {
      return;
    }


    try {

      const {
        data,
        error
      } =
        await window.supabaseClient
          .auth
          .getSession();


      if (error) {

        console.error(
          'Brit.Tuna: Session check error:',
          error
        );

        return;
      }


      if (
        data &&
        data.session &&
        data.session.user
      ) {

        await finishLogin();

      }

    } catch (error) {

      console.error(
        'Brit.Tuna: Unable to check existing login.',
        error
      );

    }
  }


  /* ==========================================
     EMAIL + PASSWORD LOGIN
  ========================================== */

  loginForm.addEventListener(
    'submit',

    async function (event) {

      event.preventDefault();


      if (!window.supabaseClient) {

        console.error(
          'Brit.Tuna: supabaseClient is not available.'
        );

        loginMessage.textContent =
          'Login service is not ready. Please refresh the page.';

        return;
      }


      const email =
        document
          .getElementById('email')
          .value
          .trim()
          .toLowerCase();


      const password =
        document
          .getElementById('password')
          .value;


      loginMessage.textContent =
        'Signing in...';


      loginButton.disabled =
        true;


      loginButton.textContent =
        'Signing In...';


      try {

        const {
          data,
          error
        } =
          await window.supabaseClient
            .auth
            .signInWithPassword({

              email: email,

              password: password

            });


        if (error) {

          console.error(
            'Login error:',
            error
          );


          loginMessage.textContent =
            error.message ===
            'Invalid login credentials'
              ? 'Incorrect email or password.'
              : error.message;


          loginButton.disabled =
            false;


          loginButton.textContent =
            'Sign In';


          return;
        }


        if (
          data &&
          data.user
        ) {

          console.log(
            'Brit.Tuna: Login successful:',
            data.user.id
          );


          await finishLogin();

          return;
        }


        loginMessage.textContent =
          'Unable to sign in. Please try again.';


        loginButton.disabled =
          false;


        loginButton.textContent =
          'Sign In';

      } catch (error) {

        console.error(
          'Unexpected login error:',
          error
        );


        loginMessage.textContent =
          'Something went wrong. Please try again.';


        loginButton.disabled =
          false;


        loginButton.textContent =
          'Sign In';

      }

    }
  );


  /* ==========================================
     GOOGLE LOGIN
  ========================================== */

  googleLoginButton.addEventListener(
    'click',

    async function () {

      if (!window.supabaseClient) {

        console.error(
          'Brit.Tuna: supabaseClient is not available.'
        );


        loginMessage.textContent =
          'Google login is not ready. Please refresh the page.';


        return;
      }


      googleLoginButton.disabled =
        true;


      googleButtonText.textContent =
        'Connecting to Google...';


      loginMessage.textContent =
        'Opening Google Sign In...';


      try {

        /*
          IMPORTANT:

          Google returns to login.html.

          login.html then detects the new session,
          restores the pending cart product,
          and redirects to cart.html.

          Normal Google login without a pending
          shopping action goes to account.html.
        */

        const redirectURL =
          window.location.origin +
          '/login.html';


        const {
          data,
          error
        } =
          await window.supabaseClient
            .auth
            .signInWithOAuth({

              provider: 'google',

              options: {

                redirectTo:
                  redirectURL,

                queryParams: {

                  prompt:
                    'select_account'

                }

              }

            });


        if (error) {

          console.error(
            'Google login error:',
            error
          );


          loginMessage.textContent =
            error.message;


          googleLoginButton.disabled =
            false;


          googleButtonText.textContent =
            'Continue with Google';


          return;
        }


        console.log(
          'Brit.Tuna: Redirecting to Google...',
          data
        );

      } catch (error) {

        console.error(
          'Unexpected Google login error:',
          error
        );


        loginMessage.textContent =
          'Google Sign In failed. Please try again.';


        googleLoginButton.disabled =
          false;


        googleButtonText.textContent =
          'Continue with Google';

      }

    }
  );


  /* ==========================================
     CHECK SESSION WHEN PAGE LOADS
  ========================================== */

  checkExistingLogin();

</script>



<script>
  /* Show / hide password (UI only - does not touch login logic) */
  (function () {
    var btn = document.getElementById('password-toggle');
    var input = document.getElementById('password');
    if (!btn || !input) return;

    btn.addEventListener('click', function () {
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.setAttribute('aria-pressed', show ? 'true' : 'false');
      btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      document.getElementById('eye-slash').style.display = show ? '' : 'none';
    });
  })();
</script>

</body>

</html>
