<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brit.Tuna Admin Dashboard</title>
  <meta name="description" content="Brit.Tuna admin dashboard: add, edit and delete products.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1f5a3a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body data-page="dashboard">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="admin.html"><span class="logo-mark" aria-hidden="true">B</span> BRIT.TUNA ADMIN DASHBOARD</a>
      <div class="topbar-right">
        <span class="who" id="whoami"></span>
        <a class="btn btn-outline btn-sm" href="index.html" target="_blank" rel="noopener">View site</a>
        <button type="button" class="btn btn-outline btn-sm" id="logoutBtn">Sign out</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <h1 class="page-title">Dashboard</h1>
    <div id="app" aria-live="polite">
      <div class="page-loader"><span class="spinner dark"></span> Loading dashboard…</div>
    </div>
  </main>

  <div class="toast-wrap" id="toasts"></div>
  <!-- Load order matters: config → supabase → admin -->
  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script src="admin.js"></script>
</body>
</html>
