<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>My Orders | Brit.Tuna</title>

  <meta
    name="robots"
    content="noindex"
  >

  <meta
    name="theme-color"
    content="#1f5a3a"
  >


  <!-- Google Fonts -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap"
    rel="stylesheet"
  >


  <!-- Brit.Tuna CSS -->

  <link
    rel="stylesheet"
    href="style.css"
  >

  <link
    rel="stylesheet"
    href="responsive.css"
  >


  <style>

    /* ======================================================
       ORDERS PAGE
       ====================================================== */

    .orders-wrap {
      max-width: 950px;
      margin: 0 auto;
    }


    .orders-message {
      padding: 18px;
      border-radius: 14px;
      background: #f7f4eb;
      color: #34423a;
      text-align: center;
      margin-bottom: 24px;
    }


    .orders-message.error {
      background: #fff0ed;
      color: #9c2f25;
    }


    .orders-message.success {
      background: #edf7f0;
      color: #1f5a3a;
    }


    .orders-list {
      display: grid;
      gap: 20px;
    }


    .order-card {
      background: #ffffff;
      border: 1px solid rgba(31, 90, 58, 0.12);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 8px 30px rgba(25, 50, 35, 0.06);
    }


    .order-card-top {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: flex-start;
      padding-bottom: 16px;
      border-bottom: 1px solid #ecebe5;
    }


    .order-card h2 {
      margin: 0 0 5px;
      font-family: "Fraunces", serif;
      font-size: 1.25rem;
      color: #173d29;
    }


    .order-date {
      margin: 0;
      color: #6d746f;
      font-size: 0.9rem;
    }


    .order-total {
      font-size: 1.2rem;
      font-weight: 700;
      color: #1f5a3a;
      white-space: nowrap;
    }


    /* ======================================================
       OVERALL ORDER STATUS
       ====================================================== */

    .order-statuses {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 16px 0;
    }


    .order-badge {
      display: inline-flex;
      align-items: center;
      padding: 7px 11px;
      border-radius: 999px;
      background: #eef4ef;
      color: #1f5a3a;
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: capitalize;
    }


    .order-badge.payment {
      background: #fff3df;
      color: #8a5a0a;
    }


    /* ======================================================
       ORDER ITEMS
       ====================================================== */

    .order-items {
      margin: 0;
      padding: 0;
      list-style: none;
    }


    .order-item {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 15px 0;
      border-bottom: 1px dashed #e2e2dc;
    }


    .order-item:last-child {
      border-bottom: 0;
    }


    .order-item-left {
      min-width: 0;
      flex: 1;
    }


    .order-item-name {
      display: block;
      color: #29352e;
      font-weight: 700;
      margin-bottom: 8px;
    }


    .order-item-price {
      color: #58625c;
      white-space: nowrap;
      font-weight: 600;
    }


    /* ======================================================
       SELLER FULFILLMENT STATUS
       ====================================================== */

    .seller-status-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 6px;
    }


    .seller-status-label {
      color: #6d746f;
      font-size: 0.78rem;
      font-weight: 600;
    }


    .seller-status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.76rem;
      line-height: 1;
      font-weight: 700;
      text-transform: capitalize;
    }


    /* Pending */

    .seller-status.pending {
      background: #fff3df;
      color: #8a5a0a;
    }


    /* Processing */

    .seller-status.processing {
      background: #e8f1ff;
      color: #245ea8;
    }


    /* Shipped */

    .seller-status.shipped {
      background: #eee8ff;
      color: #6340a5;
    }


    /* Delivered */

    .seller-status.delivered {
      background: #e8f7ec;
      color: #18723a;
    }


    /* Cancelled */

    .seller-status.cancelled {
      background: #fff0ed;
      color: #a52f25;
    }


    .seller-status.unknown {
      background: #f1f2f1;
      color: #58625c;
    }


    /* ======================================================
       INFORMATION
       ====================================================== */

    .order-status-help {
      margin-top: 13px;
      padding: 11px 13px;
      border-radius: 10px;
      background: #f8faf8;
      color: #66716a;
      font-size: 0.78rem;
      line-height: 1.55;
    }


    .order-status-help strong {
      color: #1f5a3a;
    }


    /* ======================================================
       ACTIONS
       ====================================================== */

    .order-actions {
      margin-top: 18px;
      display: flex;
      justify-content: flex-end;
    }


    .view-order-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border-radius: 10px;
      padding: 11px 17px;
      background: #1f5a3a;
      color: #ffffff;
      font-weight: 700;
      transition: 0.2s ease;
    }


    .view-order-btn:hover {
      transform: translateY(-1px);
      opacity: 0.92;
    }


    /* ======================================================
       EMPTY STATE
       ====================================================== */

    .orders-empty {
      padding: 45px 20px;
      background: #ffffff;
      border: 1px solid rgba(31, 90, 58, 0.12);
      border-radius: 18px;
      text-align: center;
    }


    .orders-empty h2 {
      color: #173d29;
      margin-top: 0;
    }


    .orders-empty p {
      color: #6d746f;
      margin-bottom: 20px;
    }


    /* ======================================================
       MOBILE
       ====================================================== */

    @media (max-width: 600px) {

      .order-card {
        padding: 17px;
      }


      .order-card-top {
        flex-direction: column;
        gap: 8px;
      }


      .order-item {
        align-items: flex-start;
        flex-direction: column;
        gap: 8px;
      }


      .order-item-price {
        white-space: normal;
      }


      .order-actions {
        justify-content: stretch;
      }


      .view-order-btn {
        width: 100%;
      }

    }

  </style>

</head>


<body data-page="orders">


  <!-- ======================================================
       HEADER
       ====================================================== -->

  <div id="site-header"></div>


  <!-- ======================================================
       MAIN
       ====================================================== -->

  <main id="main">


    <section class="page-hero">

      <div class="container">

        <h1>
          My Orders
        </h1>

        <p>
          View your Brit.Tuna order history and seller fulfillment status.
        </p>

      </div>

    </section>


    <section class="container page-body">

      <div class="orders-wrap">


        <!-- MESSAGE -->

        <div
          id="orders-message"
          class="orders-message"
          role="status"
          aria-live="polite"
        >
          Loading your orders...
        </div>


        <!-- ORDERS -->

        <div
          id="orders-list"
          class="orders-list"
        ></div>


      </div>

    </section>


  </main>


  <!-- ======================================================
       FOOTER
       ====================================================== -->

  <div id="site-footer"></div>


  <!-- ======================================================
       SUPABASE
       ====================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <!-- ======================================================
       BRIT.TUNA FILES
       ====================================================== -->

  <script src="config.js"></script>

  <script src="supabase.js"></script>

  <script src="script.js"></script>


  <!-- ======================================================
       MY ORDERS LOGIC
       ====================================================== -->

  <script>

    (function () {

      "use strict";


      /* ====================================================
         ELEMENTS
         ==================================================== */

      var messageElement =
        document.getElementById(
          "orders-message"
        );


      var listElement =
        document.getElementById(
          "orders-list"
        );


      /* ====================================================
         ESCAPE HTML
         ==================================================== */

      function escapeHtml(value) {

        return String(
          value == null
            ? ""
            : value
        )

          .replace(
            /&/g,
            "&amp;"
          )

          .replace(
            /</g,
            "&lt;"
          )

          .replace(
            />/g,
            "&gt;"
          )

          .replace(
            /"/g,
            "&quot;"
          )

          .replace(
            /'/g,
            "&#039;"
          );

      }


      /* ====================================================
         FORMAT MONEY
         ==================================================== */

      function formatMoney(value) {

        var amount =
          Number(
            value || 0
          );


        return new Intl.NumberFormat(
          "en-IN",
          {

            style:
              "currency",

            currency:
              "INR",

            maximumFractionDigits:
              2

          }

        ).format(
          amount
        );

      }


      /* ====================================================
         FORMAT DATE
         ==================================================== */

      function formatDate(value) {

        if (!value) {

          return "";

        }


        var date =
          new Date(
            value
          );


        if (
          Number.isNaN(
            date.getTime()
          )
        ) {

          return "";

        }


        return new Intl.DateTimeFormat(
          "en-IN",
          {

            day:
              "2-digit",

            month:
              "short",

            year:
              "numeric",

            hour:
              "2-digit",

            minute:
              "2-digit"

          }

        ).format(
          date
        );

      }


      /* ====================================================
         MESSAGE
         ==================================================== */

      function showMessage(
        text,
        type
      ) {

        messageElement.textContent =
          text;


        messageElement.className =
          "orders-message";


        if (type) {

          messageElement.classList.add(
            type
          );

        }


        messageElement.hidden =
          false;

      }


      function hideMessage() {

        messageElement.hidden =
          true;

      }


      /* ====================================================
         EMPTY
         ==================================================== */

      function renderEmpty() {

        listElement.innerHTML = `

          <div class="orders-empty">

            <h2>
              No orders yet
            </h2>

            <p>
              You have not placed any Brit.Tuna orders yet.
            </p>

            <a
              href="shop.html"
              class="view-order-btn"
            >
              Start Shopping
            </a>

          </div>

        `;

      }


      /* ====================================================
         FULFILLMENT STATUS
         ==================================================== */

      function normalizeFulfillmentStatus(
        status
      ) {

        var value =
          String(
            status || "pending"
          )
            .trim()
            .toLowerCase();


        var allowedStatuses = [

          "pending",

          "processing",

          "shipped",

          "delivered",

          "cancelled"

        ];


        if (
          !allowedStatuses.includes(
            value
          )
        ) {

          return "unknown";

        }


        return value;

      }


      function fulfillmentStatusHtml(
        status
      ) {

        var safeStatus =
          normalizeFulfillmentStatus(
            status
          );


        return `

          <div class="seller-status-row">

            <span class="seller-status-label">
              Seller Status:
            </span>

            <span
              class="seller-status ${escapeHtml(
                safeStatus
              )}"
            >
              ${escapeHtml(
                safeStatus
              )}
            </span>

          </div>

        `;

      }


      /* ====================================================
         RENDER ITEMS
         ==================================================== */

      function renderItems(items) {

        if (
          !Array.isArray(items) ||
          items.length === 0
        ) {

          return `

            <li class="order-item">

              <span class="order-item-name">
                Order items unavailable
              </span>

            </li>

          `;

        }


        return items.map(

          function (item) {

            var quantity =
              Number(
                item.quantity || 1
              );


            var price =
              Number(
                item.price || 0
              );


            var lineTotal =
              price *
              quantity;


            return `

              <li class="order-item">


                <div class="order-item-left">

                  <span class="order-item-name">

                    ${escapeHtml(
                      item.product_name ||
                      "Product"
                    )}

                    × ${quantity}

                  </span>


                  ${fulfillmentStatusHtml(
                    item.fulfillment_status
                  )}

                </div>


                <span class="order-item-price">

                  ${formatMoney(
                    lineTotal
                  )}

                </span>


              </li>

            `;

          }

        ).join("");

      }


      /* ====================================================
         RENDER ORDERS
         ==================================================== */

      function renderOrders(
        orders
      ) {

        listElement.innerHTML =
          orders.map(

            function (order) {

              var orderId =
                Number(
                  order.id
                );


              var orderStatus =
                order.order_status ||
                "pending";


              var paymentStatus =
                order.payment_status ||
                "pending";


              return `

                <article class="order-card">


                  <!-- ORDER HEADER -->

                  <div class="order-card-top">

                    <div>

                      <h2>

                        Order #${escapeHtml(
                          orderId
                        )}

                      </h2>


                      <p class="order-date">

                        ${escapeHtml(
                          formatDate(
                            order.created_at
                          )
                        )}

                      </p>

                    </div>


                    <div class="order-total">

                      ${formatMoney(
                        order.total_amount
                      )}

                    </div>

                  </div>


                  <!-- OVERALL ORDER STATUS -->

                  <div class="order-statuses">

                    <span class="order-badge">

                      Order:
                      ${escapeHtml(
                        orderStatus
                      )}

                    </span>


                    <span class="order-badge payment">

                      Payment:
                      ${escapeHtml(
                        paymentStatus
                      )}

                    </span>

                  </div>


                  <!-- PRODUCTS -->

                  <ul class="order-items">

                    ${renderItems(
                      order.order_items
                    )}

                  </ul>


                  <!-- EXPLANATION -->

                  <div class="order-status-help">

                    <strong>
                      Seller Status
                    </strong>

                    shows the latest fulfillment status
                    for each product.

                    The overall

                    <strong>
                      Order Status
                    </strong>

                    is managed separately by Brit.Tuna.

                  </div>


                  <!-- VIEW ORDER -->

                  <div class="order-actions">

                    <a
                      class="view-order-btn"
                      href="order-confirmation.html?order=${encodeURIComponent(
                        orderId
                      )}"
                    >
                      View Order
                    </a>

                  </div>


                </article>

              `;

            }

          ).join("");

      }


      /* ====================================================
         LOAD ORDERS
         ==================================================== */

      async function loadOrders() {

        try {


          showMessage(
            "Loading your orders..."
          );


          /* ----------------------------------------------
             CHECK SUPABASE
             ---------------------------------------------- */

          if (
            !window.supabaseClient
          ) {

            throw new Error(
              "Supabase connection is not available."
            );

          }


          /* ----------------------------------------------
             GET SESSION
             ---------------------------------------------- */

          var sessionResult =
            await window.supabaseClient
              .auth
              .getSession();


          if (
            sessionResult.error
          ) {

            throw sessionResult.error;

          }


          var session =
            sessionResult.data &&
            sessionResult.data.session;


          /* ----------------------------------------------
             LOGIN REQUIRED
             ---------------------------------------------- */

          if (
            !session ||
            !session.user
          ) {

            showMessage(
              "Please sign in to view your orders.",
              "error"
            );


            listElement.innerHTML = `

              <div class="orders-empty">

                <h2>
                  Sign in required
                </h2>

                <p>

                  Please sign in with your customer account
                  to view your order history.

                </p>

                <a
                  href="login.html?next=orders.html"
                  class="view-order-btn"
                >
                  Login
                </a>

              </div>

            `;


            return;

          }


          /* ==================================================
             GET CUSTOMER ORDERS

             IMPORTANT:
             fulfillment_status is fetched from order_items.
             ================================================== */

          var orderResult =
            await window.supabaseClient

              .from(
                "orders"
              )

              .select(
                `

                id,

                user_id,

                total_amount,

                payment_status,

                order_status,

                payment_method,

                created_at,

                order_items (

                  id,

                  product_id,

                  product_name,

                  price,

                  quantity,

                  fulfillment_status

                )

                `
              )

              .eq(
                "user_id",
                session.user.id
              )

              .order(
                "created_at",
                {
                  ascending: false
                }
              );


          /* ----------------------------------------------
             ERROR
             ---------------------------------------------- */

          if (
            orderResult.error
          ) {

            throw orderResult.error;

          }


          var orders =
            orderResult.data ||
            [];


          console.log(
            "Brit.Tuna Customer Orders:",
            orders
          );


          hideMessage();


          /* ----------------------------------------------
             NO ORDERS
             ---------------------------------------------- */

          if (
            orders.length ===
            0
          ) {

            renderEmpty();

            return;

          }


          /* ----------------------------------------------
             RENDER
             ---------------------------------------------- */

          renderOrders(
            orders
          );


        }

        catch (error) {

          console.error(
            "Brit.Tuna My Orders error:",
            error
          );


          showMessage(

            error &&
            error.message

              ? error.message

              : "Unable to load your orders.",

            "error"

          );

        }

      }


      /* ====================================================
         START
         ==================================================== */

      document.addEventListener(

        "DOMContentLoaded",

        loadOrders

      );


    })();

  </script>


</body>

</html>
