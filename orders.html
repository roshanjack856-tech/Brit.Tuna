<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Orders | Brit.Tuna</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1f5a3a">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="responsive.css">

  <style>
    .orders-wrap {
      max-width: 950px;
      margin: 0 auto;
    }

    .orders-message {
      padding: 18px;
      border-radius: 14px;
      background: #f7f4eb;
      color: #34423a;
      text-align: center;
      margin-bottom: 24px;
    }

    .orders-message.error {
      background: #fff0ed;
      color: #9c2f25;
    }

    .orders-message.success {
      background: #edf7f0;
      color: #1f5a3a;
    }

    .orders-list {
      display: grid;
      gap: 20px;
    }

    .order-card {
      background: #ffffff;
      border: 1px solid rgba(31, 90, 58, 0.12);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 8px 30px rgba(25, 50, 35, 0.06);
    }

    .order-card-top {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: flex-start;
      padding-bottom: 16px;
      border-bottom: 1px solid #ecebe5;
    }

    .order-card h2 {
      margin: 0 0 5px;
      font-family: "Fraunces", serif;
      font-size: 1.25rem;
      color: #173d29;
    }

    .order-date {
      margin: 0;
      color: #6d746f;
      font-size: 0.9rem;
    }

    .order-total {
      font-size: 1.2rem;
      font-weight: 700;
      color: #1f5a3a;
      white-space: nowrap;
    }

    .order-statuses {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 16px 0;
    }

    .order-badge {
      display: inline-flex;
      align-items: center;
      padding: 7px 11px;
      border-radius: 999px;
      background: #eef4ef;
      color: #1f5a3a;
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: capitalize;
    }

    .order-badge.payment {
      background: #fff3df;
      color: #8a5a0a;
    }

    .order-items {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .order-item {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 0;
      border-bottom: 1px dashed #e2e2dc;
    }

    .order-item:last-child {
      border-bottom: 0;
    }

    .order-item-name {
      color: #29352e;
      font-weight: 600;
    }

    .order-item-price {
      color: #58625c;
      white-space: nowrap;
    }

    .order-actions {
      margin-top: 18px;
      display: flex;
      justify-content: flex-end;
    }

    .view-order-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border-radius: 10px;
      padding: 11px 17px;
      background: #1f5a3a;
      color: #ffffff;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .view-order-btn:hover {
      transform: translateY(-1px);
      opacity: 0.92;
    }

    .orders-empty {
      padding: 45px 20px;
      background: #ffffff;
      border: 1px solid rgba(31, 90, 58, 0.12);
      border-radius: 18px;
      text-align: center;
    }

    .orders-empty h2 {
      color: #173d29;
      margin-top: 0;
    }

    .orders-empty p {
      color: #6d746f;
      margin-bottom: 20px;
    }

    @media (max-width: 600px) {
      .order-card {
        padding: 17px;
      }

      .order-card-top {
        flex-direction: column;
        gap: 8px;
      }

      .order-item {
        align-items: flex-start;
      }

      .order-actions {
        justify-content: stretch;
      }

      .view-order-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body data-page="orders">

  <!-- Header, mobile menu and WhatsApp button are built by script.js -->
  <div id="site-header"></div>

  <main id="main">

    <section class="page-hero">
      <div class="container">
        <h1>My Orders</h1>
        <p>View your Brit.Tuna order history.</p>
      </div>
    </section>

    <section class="container page-body">
      <div class="orders-wrap">

        <div
          id="orders-message"
          class="orders-message"
          role="status"
          aria-live="polite"
        >
          Loading your orders...
        </div>

        <div id="orders-list" class="orders-list"></div>

      </div>
    </section>

  </main>

  <div id="site-footer"></div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Brit.Tuna -->
  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script src="script.js"></script>

  <script>
    (function () {
      "use strict";

      var messageElement = document.getElementById("orders-message");
      var listElement = document.getElementById("orders-list");

      function escapeHtml(value) {
        return String(value == null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function formatMoney(value) {
        var amount = Number(value || 0);

        return new Intl.NumberFormat("en-IN", {
          style: "currency",
          currency: "INR",
          maximumFractionDigits: 2
        }).format(amount);
      }

      function formatDate(value) {
        if (!value) {
          return "";
        }

        var date = new Date(value);

        if (Number.isNaN(date.getTime())) {
          return "";
        }

        return new Intl.DateTimeFormat("en-IN", {
          day: "2-digit",
          month: "short",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }).format(date);
      }

      function showMessage(text, type) {
        messageElement.textContent = text;
        messageElement.className = "orders-message";

        if (type) {
          messageElement.classList.add(type);
        }

        messageElement.hidden = false;
      }

      function hideMessage() {
        messageElement.hidden = true;
      }

      function renderEmpty() {
        listElement.innerHTML = `
          <div class="orders-empty">
            <h2>No orders yet</h2>
            <p>
              You have not placed any Brit.Tuna orders yet.
            </p>
            <a href="shop.html" class="view-order-btn">
              Start Shopping
            </a>
          </div>
        `;
      }

      function renderItems(items) {
        if (!Array.isArray(items) || items.length === 0) {
          return `
            <li class="order-item">
              <span class="order-item-name">
                Order items unavailable
              </span>
            </li>
          `;
        }

        return items.map(function (item) {
          var quantity = Number(item.quantity || 1);
          var price = Number(item.price || 0);
          var lineTotal = price * quantity;

          return `
            <li class="order-item">
              <span class="order-item-name">
                ${escapeHtml(item.product_name || "Product")}
                × ${quantity}
              </span>

              <span class="order-item-price">
                ${formatMoney(lineTotal)}
              </span>
            </li>
          `;
        }).join("");
      }

      function renderOrders(orders) {
        listElement.innerHTML = orders.map(function (order) {
          var orderId = Number(order.id);
          var orderStatus = order.order_status || "pending";
          var paymentStatus = order.payment_status || "pending";

          return `
            <article class="order-card">

              <div class="order-card-top">
                <div>
                  <h2>Order #${escapeHtml(orderId)}</h2>
                  <p class="order-date">
                    ${escapeHtml(formatDate(order.created_at))}
                  </p>
                </div>

                <div class="order-total">
                  ${formatMoney(order.total_amount)}
                </div>
              </div>

              <div class="order-statuses">
                <span class="order-badge">
                  Order: ${escapeHtml(orderStatus)}
                </span>

                <span class="order-badge payment">
                  Payment: ${escapeHtml(paymentStatus)}
                </span>
              </div>

              <ul class="order-items">
                ${renderItems(order.order_items)}
              </ul>

              <div class="order-actions">
                <a
                  class="view-order-btn"
                  href="order-confirmation.html?order=${encodeURIComponent(orderId)}"
                >
                  View Order
                </a>
              </div>

            </article>
          `;
        }).join("");
      }

      async function loadOrders() {
        try {
          showMessage("Loading your orders...");

          if (!window.supabaseClient) {
            throw new Error(
              "Supabase connection is not available."
            );
          }

          var sessionResult =
            await window.supabaseClient.auth.getSession();

          if (sessionResult.error) {
            throw sessionResult.error;
          }

          var session =
            sessionResult.data &&
            sessionResult.data.session;

          if (!session || !session.user) {
            showMessage(
              "Please sign in to view your orders.",
              "error"
            );

            listElement.innerHTML = `
              <div class="orders-empty">
                <h2>Sign in required</h2>
                <p>
                  Please sign in with your customer account
                  to view your order history.
                </p>
                <a
                  href="login.html?next=orders.html"
                  class="view-order-btn"
                >
                  Login
                </a>
              </div>
            `;

            return;
          }

          var orderResult =
            await window.supabaseClient
              .from("orders")
              .select(`
                id,
                user_id,
                total_amount,
                payment_status,
                order_status,
                payment_method,
                created_at,
                order_items (
                  id,
                  product_id,
                  product_name,
                  price,
                  quantity
                )
              `)
              .eq("user_id", session.user.id)
              .order("created_at", {
                ascending: false
              });

          if (orderResult.error) {
            throw orderResult.error;
          }

          var orders = orderResult.data || [];

          hideMessage();

          if (orders.length === 0) {
            renderEmpty();
            return;
          }

          renderOrders(orders);

        } catch (error) {
          console.error(
            "Brit.Tuna My Orders error:",
            error
          );

          showMessage(
            error && error.message
              ? error.message
              : "Unable to load your orders.",
            "error"
          );
        }
      }

      document.addEventListener(
        "DOMContentLoaded",
        loadOrders
      );
    })();
  </script>

</body>
</html>
