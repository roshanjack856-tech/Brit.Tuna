<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>My Orders | Brit.Tuna</title>

  <meta
    name="robots"
    content="noindex"
  >

  <meta
    name="theme-color"
    content="#1f5a3a"
  >


  <!-- Google Fonts -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap"
    rel="stylesheet"
  >


  <!-- Brit.Tuna CSS -->

  <link
    rel="stylesheet"
    href="style.css"
  >

  <link
    rel="stylesheet"
    href="responsive.css"
  >


  <style>

    /* ======================================================
       ORDERS PAGE
       ====================================================== */

    .orders-wrap {
      max-width: 950px;
      margin: 0 auto;
    }


    .orders-message {
      padding: 18px;
      border-radius: 14px;
      background: #f7f4eb;
      color: #34423a;
      text-align: center;
      margin-bottom: 24px;
    }


    .orders-message.error {
      background: #fff0ed;
      color: #9c2f25;
    }


    .orders-message.success {
      background: #edf7f0;
      color: #1f5a3a;
    }


    .orders-list {
      display: grid;
      gap: 20px;
    }


    /* ======================================================
       ORDER CARD
       ====================================================== */

    .order-card {
      background: #ffffff;
      border: 1px solid rgba(31, 90, 58, 0.12);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 8px 30px rgba(25, 50, 35, 0.06);
      overflow: hidden;
    }


    .order-card-top {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: flex-start;
      padding-bottom: 16px;
      border-bottom: 1px solid #ecebe5;
    }


    .order-card h2 {
      margin: 0 0 5px;
      font-family: "Fraunces", serif;
      font-size: 1.25rem;
      color: #173d29;
    }


    .order-date {
      margin: 0;
      color: #6d746f;
      font-size: 0.9rem;
    }


    .order-total {
      font-size: 1.2rem;
      font-weight: 700;
      color: #1f5a3a;
      white-space: nowrap;
    }


    /* ======================================================
       ORDER STATUS
       ====================================================== */

    .order-statuses {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 16px 0;
    }


    .order-badge {
      display: inline-flex;
      align-items: center;
      padding: 7px 11px;
      border-radius: 999px;
      background: #eef4ef;
      color: #1f5a3a;
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: capitalize;
    }


    .order-badge.payment {
      background: #fff3df;
      color: #8a5a0a;
    }


    /* ======================================================
       ORDER ITEMS
       ====================================================== */

    .order-items {
      margin: 0;
      padding: 0;
      list-style: none;
    }


    .order-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 16px 0;
      border-bottom: 1px dashed #e2e2dc;
    }


    .order-item:last-child {
      border-bottom: 0;
    }


    /* ======================================================
       PRODUCT IMAGE + INFORMATION
       ====================================================== */

    .order-product {
      display: flex;
      align-items: center;
      gap: 15px;
      flex: 1;
      min-width: 0;
    }


    .order-product-image-link {
      width: 90px;
      height: 90px;
      flex: 0 0 90px;
      display: block;
      border-radius: 13px;
      overflow: hidden;
      background: #f7f4eb;
      border: 1px solid #ece7da;
      text-decoration: none;
    }


    .order-product-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.25s ease;
    }


    .order-product-image-link:hover .order-product-image {
      transform: scale(1.04);
    }


    .order-item-left {
      min-width: 0;
      flex: 1;
    }


    .order-item-name {
      display: inline-block;
      color: #29352e;
      font-weight: 700;
      margin-bottom: 7px;
      text-decoration: none;
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: break-word;
    }


    a.order-item-name:hover {
      color: #1f5a3a;
      text-decoration: underline;
    }


    .order-item-price {
      color: #1f5a3a;
      white-space: nowrap;
      font-weight: 700;
      font-size: 1rem;
    }


    /* ======================================================
       PACK / VARIANT
       ====================================================== */

    .order-item-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      margin-top: 5px;
      margin-bottom: 7px;
    }


    .order-pack {
      display: inline-flex;
      align-items: center;
      padding: 5px 9px;
      border-radius: 8px;
      background: #edf5ef;
      color: #1f5a3a;
      font-size: 0.78rem;
      font-weight: 700;
    }


    .order-variant {
      display: inline-flex;
      align-items: center;
      padding: 5px 9px;
      border-radius: 8px;
      background: #f4f4f1;
      color: #66716a;
      font-size: 0.76rem;
      font-weight: 600;
    }


    /* ======================================================
       SELLER STATUS
       ====================================================== */

    .seller-status-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 6px;
    }


    .seller-status-label {
      color: #6d746f;
      font-size: 0.78rem;
      font-weight: 600;
    }


    .seller-status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.76rem;
      line-height: 1;
      font-weight: 700;
      text-transform: capitalize;
    }


    .seller-status.pending {
      background: #fff3df;
      color: #8a5a0a;
    }


    .seller-status.processing {
      background: #e8f1ff;
      color: #245ea8;
    }


    .seller-status.shipped {
      background: #eee8ff;
      color: #6340a5;
    }


    .seller-status.delivered {
      background: #e8f7ec;
      color: #18723a;
    }


    .seller-status.cancelled {
      background: #fff0ed;
      color: #a52f25;
    }


    .seller-status.unknown {
      background: #f1f2f1;
      color: #58625c;
    }


    /* ======================================================
       HELP
       ====================================================== */

    .order-status-help {
      margin-top: 13px;
      padding: 11px 13px;
      border-radius: 10px;
      background: #f8faf8;
      color: #66716a;
      font-size: 0.78rem;
      line-height: 1.55;
    }


    .order-status-help strong {
      color: #1f5a3a;
    }


    /* ======================================================
       ACTIONS
       ====================================================== */

    .order-actions {
      margin-top: 18px;
      display: flex;
      justify-content: flex-end;
    }


    .view-order-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border-radius: 10px;
      padding: 11px 17px;
      background: #1f5a3a;
      color: #ffffff;
      font-weight: 700;
      transition: 0.2s ease;
    }


    .view-order-btn:hover {
      transform: translateY(-1px);
      opacity: 0.92;
    }


    /* ======================================================
       EMPTY STATE
       ====================================================== */

    .orders-empty {
      padding: 45px 20px;
      background: #ffffff;
      border: 1px solid rgba(31, 90, 58, 0.12);
      border-radius: 18px;
      text-align: center;
    }


    .orders-empty h2 {
      color: #173d29;
      margin-top: 0;
    }


    .orders-empty p {
      color: #6d746f;
      margin-bottom: 20px;
    }


    /* ======================================================
       MOBILE
       ====================================================== */

    @media (max-width: 600px) {

      .order-card {
        padding: 16px;
      }


      .order-card-top {
        flex-direction: column;
        gap: 8px;
      }


      .order-item {
        align-items: flex-start;
        flex-direction: column;
        gap: 12px;
      }


      .order-product {
        width: 100%;
        align-items: flex-start;
      }


      .order-product-image-link {
        width: 78px;
        height: 78px;
        flex-basis: 78px;
      }


      .order-item-price {
        margin-left: 93px;
        white-space: normal;
      }


      .order-actions {
        justify-content: stretch;
      }


      .view-order-btn {
        width: 100%;
      }

    }


    @media (max-width: 380px) {

      .order-product-image-link {
        width: 68px;
        height: 68px;
        flex-basis: 68px;
      }


      .order-product {
        gap: 11px;
      }


      .order-item-price {
        margin-left: 79px;
      }

    }

  </style>

</head>


<body data-page="orders">


  <!-- HEADER -->

  <div id="site-header"></div>


  <!-- MAIN -->

  <main id="main">


    <section class="page-hero">

      <div class="container">

        <h1>
          My Orders
        </h1>

        <p>
          View your Brit.Tuna order history and seller fulfillment status.
        </p>

      </div>

    </section>


    <section class="container page-body">

      <div class="orders-wrap">


        <div
          id="orders-message"
          class="orders-message"
          role="status"
          aria-live="polite"
        >
          Loading your orders...
        </div>


        <div
          id="orders-list"
          class="orders-list"
        ></div>


      </div>

    </section>


  </main>


  <!-- FOOTER -->

  <div id="site-footer"></div>


  <!-- SUPABASE -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <!-- BRIT.TUNA FILES -->

  <script src="config.js"></script>

  <script src="supabase.js"></script>

  <script src="script.js"></script>


  <!-- MY ORDERS LOGIC -->

  <script>

    (function () {

      "use strict";


      /* ====================================================
         ELEMENTS
         ==================================================== */

      var messageElement =
        document.getElementById(
          "orders-message"
        );


      var listElement =
        document.getElementById(
          "orders-list"
        );


      /*
        Product image information is stored here.

        Key:
        product ID

        Value:
        image URL
      */

      var productImageMap =
        {};


      /* ====================================================
         ESCAPE HTML
         ==================================================== */

      function escapeHtml(value) {

        return String(
          value == null
            ? ""
            : value
        )

          .replace(
            /&/g,
            "&amp;"
          )

          .replace(
            /</g,
            "&lt;"
          )

          .replace(
            />/g,
            "&gt;"
          )

          .replace(
            /"/g,
            "&quot;"
          )

          .replace(
            /'/g,
            "&#039;"
          );

      }


      /* ====================================================
         FORMAT MONEY
         ==================================================== */

      function formatMoney(value) {

        var amount =
          Number(
            value || 0
          );


        return new Intl.NumberFormat(
          "en-IN",
          {

            style:
              "currency",

            currency:
              "INR",

            maximumFractionDigits:
              2

          }

        ).format(
          amount
        );

      }


      /* ====================================================
         FORMAT DATE
         ==================================================== */

      function formatDate(value) {

        if (!value) {

          return "";

        }


        var date =
          new Date(
            value
          );


        if (
          Number.isNaN(
            date.getTime()
          )
        ) {

          return "";

        }


        return new Intl.DateTimeFormat(
          "en-IN",
          {

            day:
              "2-digit",

            month:
              "short",

            year:
              "numeric",

            hour:
              "2-digit",

            minute:
              "2-digit"

          }

        ).format(
          date
        );

      }


      /* ====================================================
         MESSAGE
         ==================================================== */

      function showMessage(
        text,
        type
      ) {

        if (!messageElement) {

          return;

        }


        messageElement.textContent =
          text;


        messageElement.className =
          "orders-message";


        if (type) {

          messageElement.classList.add(
            type
          );

        }


        messageElement.hidden =
          false;

      }


      function hideMessage() {

        if (messageElement) {

          messageElement.hidden =
            true;

        }

      }


      /* ====================================================
         PLACEHOLDER IMAGE
         ==================================================== */

      function placeholderImage() {

        return (
          "data:image/svg+xml;charset=UTF-8," +
          encodeURIComponent(
            `
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="400"
              height="400"
              viewBox="0 0 400 400"
            >
              <rect
                width="400"
                height="400"
                fill="#f7f4eb"
              />

              <circle
                cx="200"
                cy="155"
                r="55"
                fill="#dfe9e1"
              />

              <path
                d="M100 310 L170 220 L215 265 L255 220 L320 310 Z"
                fill="#c9d9cd"
              />

              <text
                x="200"
                y="360"
                text-anchor="middle"
                font-family="Arial, sans-serif"
                font-size="24"
                fill="#1f5a3a"
              >
                Brit.Tuna
              </text>
            </svg>
            `
          )
        );

      }


      /* ====================================================
         PRODUCT URL
         ==================================================== */

      function productUrl(productId) {

        var id =
          Number(
            productId
          );


        if (
          !Number.isInteger(id) ||
          id <= 0
        ) {

          return "shop.html";

        }


        return (
          "product-details.html?id=" +
          encodeURIComponent(
            String(id)
          )
        );

      }


      /* ====================================================
         PRODUCT IMAGE
         ==================================================== */

      function getProductImage(productId) {

        var id =
          String(
            productId || ""
          );


        return (
          productImageMap[id] ||
          placeholderImage()
        );

      }


      /* ====================================================
         EMPTY STATE
         ==================================================== */

      function renderEmpty() {

        listElement.innerHTML = `

          <div class="orders-empty">

            <h2>
              No orders yet
            </h2>

            <p>
              You have not placed any Brit.Tuna orders yet.
            </p>

            <a
              href="shop.html"
              class="view-order-btn"
            >
              Start Shopping
            </a>

          </div>

        `;

      }


      /* ====================================================
         FULFILLMENT STATUS
         ==================================================== */

      function normalizeFulfillmentStatus(
        status
      ) {

        var value =
          String(
            status || "pending"
          )
            .trim()
            .toLowerCase();


        var allowedStatuses = [

          "pending",

          "processing",

          "shipped",

          "delivered",

          "cancelled"

        ];


        if (
          !allowedStatuses.includes(
            value
          )
        ) {

          return "unknown";

        }


        return value;

      }


      function fulfillmentStatusHtml(
        status
      ) {

        var safeStatus =
          normalizeFulfillmentStatus(
            status
          );


        return `

          <div class="seller-status-row">

            <span class="seller-status-label">
              Seller Status:
            </span>

            <span
              class="seller-status ${escapeHtml(
                safeStatus
              )}"
            >
              ${escapeHtml(
                safeStatus
              )}
            </span>

          </div>

        `;

      }


      /* ====================================================
         PRODUCT PACK / VARIANT
         ==================================================== */

      function productMetaHtml(
        item
      ) {

        var packSize =
          item &&
          item.pack_size

            ? String(
                item.pack_size
              ).trim()

            : "";


        var variantId =
          item &&
          item.variant_id

            ? item.variant_id

            : null;


        if (
          !packSize &&
          !variantId
        ) {

          return "";

        }


        var html =
          '<div class="order-item-meta">';


        if (packSize) {

          html += `

            <span class="order-pack">

              Pack:
              ${escapeHtml(
                packSize
              )}

            </span>

          `;

        }


        if (variantId) {

          html += `

            <span class="order-variant">

              Variant ID:
              ${escapeHtml(
                variantId
              )}

            </span>

          `;

        }


        html +=
          "</div>";


        return html;

      }


      /* ====================================================
         LOAD PRODUCT IMAGES

         Image priority:

         1. product_images.is_primary = true
         2. lowest sort_order
         3. products.image_url
         4. placeholder
         ==================================================== */

      async function loadProductImages(
        orders
      ) {

        productImageMap =
          {};


        var productIds =
          [];


        orders.forEach(
          function (order) {

            var items =
              Array.isArray(
                order.order_items
              )

                ? order.order_items

                : [];


            items.forEach(
              function (item) {

                var id =
                  Number(
                    item.product_id
                  );


                if (
                  Number.isInteger(id) &&
                  id > 0 &&
                  !productIds.includes(id)
                ) {

                  productIds.push(
                    id
                  );

                }

              }
            );

          }
        );


        if (
          productIds.length === 0
        ) {

          return;

        }


        /*
          First load legacy products.image_url.

          This is also used as fallback when
          product_images has no image.
        */

        try {

          var productResult =
            await window.supabaseClient

              .from(
                "products"
              )

              .select(
                "id, image_url"
              )

              .in(
                "id",
                productIds
              );


          if (productResult.error) {

            console.warn(
              "Brit.Tuna: Product fallback images could not be loaded.",
              productResult.error
            );

          } else {

            (
              productResult.data ||
              []
            ).forEach(
              function (product) {

                if (
                  product.image_url
                ) {

                  productImageMap[
                    String(
                      product.id
                    )
                  ] =
                    product.image_url;

                }

              }
            );

          }

        } catch (error) {

          console.warn(
            "Brit.Tuna: Product fallback image loading failed.",
            error
          );

        }


        /*
          Now load product_images.

          They override the old
          products.image_url.
        */

        try {

          var imageResult =
            await window.supabaseClient

              .from(
                "product_images"
              )

              .select(
                `
                id,
                product_id,
                image_url,
                sort_order,
                is_primary
                `
              )

              .in(
                "product_id",
                productIds
              )

              .order(
                "sort_order",
                {
                  ascending:
                    true
                }
              );


          if (imageResult.error) {

            console.warn(
              "Brit.Tuna: Product images could not be loaded.",
              imageResult.error
            );

            return;

          }


          var groupedImages =
            {};


          (
            imageResult.data ||
            []
          ).forEach(
            function (image) {

              var key =
                String(
                  image.product_id
                );


              if (
                !groupedImages[key]
              ) {

                groupedImages[key] =
                  [];

              }


              groupedImages[key].push(
                image
              );

            }
          );


          Object.keys(
            groupedImages
          ).forEach(
            function (productId) {

              var images =
                groupedImages[
                  productId
                ];


              images.sort(
                function (a, b) {

                  /*
                    Primary image first.
                  */

                  if (
                    a.is_primary &&
                    !b.is_primary
                  ) {

                    return -1;

                  }


                  if (
                    !a.is_primary &&
                    b.is_primary
                  ) {

                    return 1;

                  }


                  /*
                    Then sort_order.
                  */

                  return (
                    Number(
                      a.sort_order || 0
                    ) -
                    Number(
                      b.sort_order || 0
                    )
                  );

                }
              );


              var selectedImage =
                images.find(
                  function (image) {

                    return (
                      image &&
                      image.image_url
                    );

                  }
                );


              if (
                selectedImage &&
                selectedImage.image_url
              ) {

                productImageMap[
                  productId
                ] =
                  selectedImage.image_url;

              }

            }
          );


        } catch (error) {

          console.warn(
            "Brit.Tuna: Product image loading failed.",
            error
          );

        }

      }


      /* ====================================================
         RENDER ORDER ITEMS
         ==================================================== */

      function renderItems(
        items
      ) {

        if (
          !Array.isArray(items) ||
          items.length === 0
        ) {

          return `

            <li class="order-item">

              <span class="order-item-name">
                Order items unavailable
              </span>

            </li>

          `;

        }


        return items.map(

          function (item) {

            var quantity =
              Number(
                item.quantity || 1
              );


            var price =
              Number(
                item.price || 0
              );


            var lineTotal =
              price *
              quantity;


            var imageUrl =
              getProductImage(
                item.product_id
              );


            var detailsUrl =
              productUrl(
                item.product_id
              );


            return `

              <li class="order-item">


                <div class="order-product">


                  <!-- PRODUCT IMAGE -->

                  <a
                    class="order-product-image-link"
                    href="${escapeHtml(
                      detailsUrl
                    )}"
                    aria-label="View ${escapeHtml(
                      item.product_name ||
                      "product"
                    )}"
                  >

                    <img
                      class="order-product-image"
                      src="${escapeHtml(
                        imageUrl
                      )}"
                      alt="${escapeHtml(
                        item.product_name ||
                        "Brit.Tuna product"
                      )}"
                      loading="lazy"
                      data-fallback="true"
                    >

                  </a>


                  <!-- PRODUCT INFORMATION -->

                  <div class="order-item-left">


                    <a
                      class="order-item-name"
                      href="${escapeHtml(
                        detailsUrl
                      )}"
                    >

                      ${escapeHtml(
                        item.product_name ||
                        "Product"
                      )}

                      × ${escapeHtml(
                        quantity
                      )}

                    </a>


                    ${productMetaHtml(
                      item
                    )}


                    ${fulfillmentStatusHtml(
                      item.fulfillment_status
                    )}


                  </div>


                </div>


                <!-- ITEM TOTAL -->

                <span class="order-item-price">

                  ${formatMoney(
                    lineTotal
                  )}

                </span>


              </li>

            `;

          }

        ).join("");

      }


      /* ====================================================
         RENDER ORDERS
         ==================================================== */

      function renderOrders(
        orders
      ) {

        listElement.innerHTML =
          orders.map(

            function (order) {

              var orderId =
                Number(
                  order.id
                );


              var orderStatus =
                order.order_status ||
                "pending";


              var paymentStatus =
                order.payment_status ||
                "pending";


              return `

                <article class="order-card">


                  <!-- ORDER HEADER -->

                  <div class="order-card-top">

                    <div>

                      <h2>

                        Order #${escapeHtml(
                          orderId
                        )}

                      </h2>


                      <p class="order-date">

                        ${escapeHtml(
                          formatDate(
                            order.created_at
                          )
                        )}

                      </p>

                    </div>


                    <div class="order-total">

                      ${formatMoney(
                        order.total_amount
                      )}

                    </div>

                  </div>


                  <!-- ORDER STATUS -->

                  <div class="order-statuses">

                    <span class="order-badge">

                      Order:
                      ${escapeHtml(
                        orderStatus
                      )}

                    </span>


                    <span class="order-badge payment">

                      Payment:
                      ${escapeHtml(
                        paymentStatus
                      )}

                    </span>

                  </div>


                  <!-- PRODUCTS -->

                  <ul class="order-items">

                    ${renderItems(
                      order.order_items
                    )}

                  </ul>


                  <!-- INFORMATION -->

                  <div class="order-status-help">

                    <strong>
                      Seller Status
                    </strong>

                    shows the latest fulfillment status
                    for each product.

                    The overall

                    <strong>
                      Order Status
                    </strong>

                    is managed separately by Brit.Tuna.

                  </div>


                  <!-- VIEW ORDER -->

                  <div class="order-actions">

                    <a
                      class="view-order-btn"
                      href="order-confirmation.html?order=${encodeURIComponent(
                        orderId
                      )}"
                    >
                      View Order
                    </a>

                  </div>


                </article>

              `;

            }

          ).join("");


        /*
          If a Supabase image URL becomes
          unavailable, show placeholder.
        */

        listElement
          .querySelectorAll(
            ".order-product-image"
          )
          .forEach(
            function (image) {

              image.addEventListener(
                "error",
                function () {

                  if (
                    image.dataset.fallback ===
                    "done"
                  ) {

                    return;

                  }


                  image.dataset.fallback =
                    "done";


                  image.src =
                    placeholderImage();

                }
              );

            }
          );

      }


      /* ====================================================
         LOAD ORDERS
         ==================================================== */

      async function loadOrders() {

        try {


          showMessage(
            "Loading your orders..."
          );


          /* ----------------------------------------------
             CHECK SUPABASE
             ---------------------------------------------- */

          if (
            !window.supabaseClient
          ) {

            throw new Error(
              "Supabase connection is not available."
            );

          }


          /* ----------------------------------------------
             GET SESSION
             ---------------------------------------------- */

          var sessionResult =
            await window.supabaseClient
              .auth
              .getSession();


          if (
            sessionResult.error
          ) {

            throw sessionResult.error;

          }


          var session =
            sessionResult.data &&
            sessionResult.data.session;


          /* ----------------------------------------------
             LOGIN REQUIRED
             ---------------------------------------------- */

          if (
            !session ||
            !session.user
          ) {

            showMessage(
              "Please sign in to view your orders.",
              "error"
            );


            listElement.innerHTML = `

              <div class="orders-empty">

                <h2>
                  Sign in required
                </h2>

                <p>
                  Please sign in with your customer account
                  to view your order history.
                </p>

                <a
                  href="login.html?next=orders.html"
                  class="view-order-btn"
                >
                  Login
                </a>

              </div>

            `;


            return;

          }


          /* ==================================================
             GET CUSTOMER ORDERS
             ================================================== */

          var orderResult =
            await window.supabaseClient

              .from(
                "orders"
              )

              .select(
                `

                id,

                user_id,

                total_amount,

                payment_status,

                order_status,

                payment_method,

                created_at,

                order_items (

                  id,

                  product_id,

                  seller_id,

                  variant_id,

                  product_name,

                  pack_size,

                  price,

                  quantity,

                  fulfillment_status

                )

                `
              )

              .eq(
                "user_id",
                session.user.id
              )

              .order(
                "created_at",
                {
                  ascending:
                    false
                }
              );


          if (
            orderResult.error
          ) {

            throw orderResult.error;

          }


          var orders =
            orderResult.data ||
            [];


          console.log(
            "Brit.Tuna Customer Orders:",
            orders
          );


          /* ----------------------------------------------
             NO ORDERS
             ---------------------------------------------- */

          if (
            orders.length ===
            0
          ) {

            hideMessage();

            renderEmpty();

            return;

          }


          /* ----------------------------------------------
             LOAD PRODUCT IMAGES

             IMPORTANT:
             Do this before rendering orders.
             ---------------------------------------------- */

          await loadProductImages(
            orders
          );


          console.log(
            "Brit.Tuna Order Product Images:",
            productImageMap
          );


          /* ----------------------------------------------
             RENDER
             ---------------------------------------------- */

          hideMessage();


          renderOrders(
            orders
          );


        } catch (error) {

          console.error(
            "Brit.Tuna My Orders error:",
            error
          );


          showMessage(

            error &&
            error.message

              ? error.message

              : "Unable to load your orders.",

            "error"

          );

        }

      }


      /* ====================================================
         START
         ==================================================== */

      document.addEventListener(

        "DOMContentLoaded",

        loadOrders

      );


    })();

  </script>


</body>

</html>
