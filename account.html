<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>My Account | Brit.Tuna</title>

  <meta
    name="robots"
    content="noindex"
  >

  <meta
    name="theme-color"
    content="#1f5a3a"
  >

  <!-- GOOGLE FONTS -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap"
    rel="stylesheet"
  >

  <!-- WEBSITE CSS -->
  <link
    rel="stylesheet"
    href="style.css"
  >

  <link
    rel="stylesheet"
    href="responsive.css"
  >

  <style>

    .account-user-box {
      padding: 14px;
      margin-bottom: 16px;
      border-radius: 10px;
      background: #f8f4eb;
    }

    .account-user-box p {
      margin: 4px 0;
    }

    .account-status {
      font-size: 14px;
      color: #1f5a3a;
      font-weight: 600;
    }

    #logout-button {
      margin-top: 10px;
    }

    #profile-result {
      margin-top: 14px;
    }


    /* =======================================================
       ACCOUNT PAGE — app-style profile (desktop + phone)
    ======================================================= */

    body[data-page="account"] {
      background: #f7f9f6;
    }

    body[data-page="account"] .page-hero,
    body[data-page="account"] .bg-slides {
      display: none !important;
    }

    .acct-page {
      padding: 28px 16px 60px;
    }

    .acct-wrap {
      max-width: 1080px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 28px;
      align-items: start;
    }

    .acct-side {
      position: sticky;
      top: 120px;
    }

    .acct-topbar-m,
    .acct-tabbar {
      display: none;
    }

    /* ---- profile header ---- */
    .acct-head {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 4px 18px;
      border-bottom: 1px solid #e3e7e3;
      margin-bottom: 8px;
    }

    .acct-avatar {
      flex: none;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #1f5a3a, #2f7d52);
      color: #fff;
      font-size: 1.9rem;
      font-weight: 700;
      font-family: "DM Sans", system-ui, sans-serif;
      box-shadow: 0 6px 16px rgba(31, 90, 58, 0.3);
      border: 3px solid #fff;
    }

    .acct-head h1 {
      font-family: "DM Sans", system-ui, sans-serif;
      font-size: 1.45rem;
      font-weight: 700;
      color: #1b1f1d;
      margin: 0 0 2px;
      line-height: 1.2;
    }

    .acct-head p {
      margin: 2px 0 0;
      color: #6b7280;
      font-size: 0.9rem;
      overflow-wrap: anywhere;
    }

    .acct-head .account-user-box {
      background: none;
      padding: 0;
      margin: 0;
    }

    /* ---- section label + rows ---- */
    .acct-label {
      margin: 22px 0 10px 4px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #7b838a;
      letter-spacing: 0.02em;
    }

    .acct-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .acct-row {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 54px;
      padding: 0 16px;
      border-radius: 12px;
      background: #eceeec;
      color: #1b1f1d;
      font-size: 0.98rem;
      text-decoration: none;
      transition: background 0.15s, transform 0.12s, box-shadow 0.15s;
    }

    .acct-row:hover {
      background: #e3ede6;
      box-shadow: 0 4px 12px rgba(31, 90, 58, 0.12);
    }

    .acct-row:active {
      transform: scale(0.99);
    }

    .acct-row svg {
      flex: none;
      width: 22px;
      height: 22px;
      color: #1f5a3a;
    }

    .acct-row .acct-text {
      flex: 1;
    }

    .acct-row .acct-chev {
      width: 18px;
      height: 18px;
      color: #9aa1a9;
    }

    /* ---- sign in / out buttons ---- */
    .acct-actions {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .acct-actions [hidden] {
      display: none !important;
    }

    #logout-button {
      margin-top: 0;
      color: #b52d22;
      border-color: #e9c7c3;
      background: #fff;
    }

    #logout-button:hover {
      background: #fdf0ee;
    }

    /* ---- profile form card ---- */
    .acct-main .form-card {
      border-radius: 18px;
      border: 1px solid #e3e7e3;
      background: #fff;
      box-shadow: 0 6px 20px rgba(20, 30, 25, 0.06);
      scroll-margin-top: 130px;
    }

    .acct-main .form-card h2 {
      font-family: "DM Sans", system-ui, sans-serif;
      font-size: 1.25rem;
    }

    .acct-main .form-card input,
    .acct-main .form-card textarea {
      border-radius: 10px;
      background: #f6f8f6;
    }

    .acct-main .form-card input:disabled,
    .acct-main .form-card textarea:disabled {
      opacity: 0.6;
    }

    #account-notice {
      margin: 0 0 14px;
    }

    /* =======================================================
       PHONE VIEW — app screen with bottom tab bar
    ======================================================= */

    @media (max-width: 860px) {

      body[data-page="account"] #site-header,
      body[data-page="account"] #site-footer,
      body[data-page="account"] .topbar {
        display: none !important;
      }

      body[data-page="account"] .wa-float {
        bottom: 84px !important;
      }

      .acct-page {
        padding: 0 0 96px;
      }

      .acct-topbar-m {
        position: sticky;
        top: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 54px;
        padding: 0 14px;
        background: #fff;
        box-shadow: 0 1px 0 #e3e7e3;
        font-weight: 600;
        color: #1b1f1d;
      }

      .acct-topbar-m a {
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        color: #1b1f1d;
        border-radius: 50%;
      }

      .acct-topbar-m a svg {
        width: 22px;
        height: 22px;
      }

      .acct-topbar-m .acct-top-right {
        display: flex;
        gap: 2px;
      }

      .acct-wrap {
        grid-template-columns: 1fr;
        gap: 0;
        padding: 0 16px;
      }

      .acct-side {
        position: static;
      }

      .acct-main {
        margin-top: 26px;
      }

      .acct-tabbar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 40;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        background: #fff;
        padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
        box-shadow: 0 -6px 18px rgba(20, 30, 25, 0.1);
        border-radius: 18px 18px 0 0;
      }

      .acct-tabbar a {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        padding: 4px 0;
        font-size: 0.68rem;
        color: #7b838a;
        text-decoration: none;
        font-weight: 500;
      }

      .acct-tabbar a svg {
        width: 24px;
        height: 24px;
      }

      .acct-tabbar a.active {
        color: #1f5a3a;
        font-weight: 700;
      }

      .acct-tabbar a.active svg {
        fill: currentColor;
      }
    }

  </style>

</head>

          </button>

      <!-- ===============================================
           RIGHT: PROFILE FORM (existing form, unchanged)
      ================================================ -->

      <section class="acct-main" aria-label="Profile settings">

        <form
          class="form-card"
          id="profile-form"
          novalidate
        >

          <h2>
            Profile Settings
          </h2>


          <!-- LOGGED-IN STATUS -->

          <div
            id="account-user-box"
            class="account-user-box"
            hidden
          >

            <p class="account-status">
              Signed in
            </p>

            <p id="account-user-name"></p>

          </div>



          <div class="form-grid">


            <!-- EMAIL -->

            <div class="form-field full">

              <label for="p-email">
                Email
              </label>

              <input
                id="p-email"
                type="email"
                disabled
                placeholder="Sign in to see your email"
              >

            </div>



            <!-- FULL NAME -->

            <div class="form-field">

              <label for="p-name">
                Full name
              </label>

              <input
                id="p-name"
                type="text"
                autocomplete="name"
                disabled
              >

              <span
                class="error"
                id="err-p-name"
                aria-live="polite"
              ></span>

            </div>



            <!-- PHONE -->

            <div class="form-field">

              <label for="p-phone">
                Phone number
              </label>

              <input
                id="p-phone"
                type="tel"
                autocomplete="tel"
                placeholder="10-digit mobile number"
                maxlength="10"
                inputmode="numeric"
                disabled
              >

              <span
                class="error"
                id="err-p-phone"
                aria-live="polite"
              ></span>

            </div>



            <!-- DELIVERY ADDRESS -->

            <div class="form-field full">

              <label for="p-address">
                Delivery address
              </label>

              <textarea
                id="p-address"
                rows="3"
                autocomplete="street-address"
                disabled
              ></textarea>

            </div>



            <!-- CITY -->

            <div class="form-field">

              <label for="p-city">
                City
              </label>

              <input
                id="p-city"
                type="text"
                autocomplete="address-level2"
                disabled
              >

            </div>



            <!-- STATE -->

            <div class="form-field">

              <label for="p-state">
                State
              </label>

              <input
                id="p-state"
                type="text"
                autocomplete="address-level1"
                disabled
              >

            </div>



            <!-- PIN -->

            <div class="form-field">

              <label for="p-pin">
                PIN code
              </label>

              <input
                id="p-pin"
                type="text"
                inputmode="numeric"
                maxlength="6"
                autocomplete="postal-code"
                disabled
              >

              <span
                class="error"
                id="err-p-pin"
                aria-live="polite"
              ></span>

            </div>


          </div>



          <!-- SAVE -->

          <button
            type="submit"
            class="btn btn-primary btn-block"
            id="save-btn"
            disabled
          >
            Save profile
          </button>



          <div
            class="notice notice-small"
            id="profile-result"
            role="status"
            hidden
          ></div>


        </form>

      </section>

    </div>

  <!-- ============================================
       8. ACCOUNT LOGIC
  ============================================= -->

  <script>

    'use strict';



    /* ==========================================
       ELEMENTS
    ========================================== */

    const accountNotice =
      document.getElementById(
        'account-notice'
      );


    const profileForm =
      document.getElementById(
        'profile-form'
      );


    const emailInput =
      document.getElementById(
        'p-email'
      );


    const nameInput =
      document.getElementById(
        'p-name'
      );


    const phoneInput =
      document.getElementById(
        'p-phone'
      );


    const addressInput =
      document.getElementById(
        'p-address'
      );


    const cityInput =
      document.getElementById(
        'p-city'
      );


    const stateInput =
      document.getElementById(
        'p-state'
      );


    const pinInput =
      document.getElementById(
        'p-pin'
      );


    const saveButton =
      document.getElementById(
        'save-btn'
      );


    const profileResult =
      document.getElementById(
        'profile-result'
      );


    const signInLink =
      document.getElementById(
        'signin-link'
      );


    const registerLink =
      document.getElementById(
        'register-link'
      );


    const logoutButton =
      document.getElementById(
        'logout-button'
      );


    const accountUserBox =
      document.getElementById(
        'account-user-box'
      );


    const accountUserName =
      document.getElementById(
        'account-user-name'
      );



    let currentUser =
      null;



    /* ==========================================
       SHOW ACCOUNT NOTICE
    ========================================== */

    function showNotice(message) {

      accountNotice.textContent =
        message;


      accountNotice.hidden =
        false;

    }



    function hideNotice() {

      accountNotice.hidden =
        true;


      accountNotice.textContent =
        '';

    }



    /* ==========================================
       PROFILE RESULT MESSAGE
    ========================================== */

    function showProfileMessage(
      message,
      isError = false
    ) {

      profileResult.hidden =
        false;


      profileResult.textContent =
        message;


      if (isError) {

        profileResult.classList.add(
          'notice-error'
        );

      } else {

        profileResult.classList.remove(
          'notice-error'
        );

      }

    }



    function hideProfileMessage() {

      profileResult.hidden =
        true;


      profileResult.textContent =
        '';


      profileResult.classList.remove(
        'notice-error'
      );

    }



    /* ==========================================
       ENABLE PROFILE FORM
    ========================================== */

    function enableProfileForm() {

      nameInput.disabled =
        false;


      phoneInput.disabled =
        false;


      addressInput.disabled =
        false;


      cityInput.disabled =
        false;


      stateInput.disabled =
        false;


      pinInput.disabled =
        false;


      saveButton.disabled =
        false;

    }



    /* ==========================================
       DISABLE PROFILE FORM
    ========================================== */

    function disableProfileForm() {

      nameInput.disabled =
        true;


      phoneInput.disabled =
        true;


      addressInput.disabled =
        true;


      cityInput.disabled =
        true;


      stateInput.disabled =
        true;


      pinInput.disabled =
        true;


      saveButton.disabled =
        true;

    }



    /* ==========================================
       CLEAR PROFILE FORM
    ========================================== */

    function clearProfileForm() {

      emailInput.value =
        '';


      nameInput.value =
        '';


      phoneInput.value =
        '';


      addressInput.value =
        '';


      cityInput.value =
        '';


      stateInput.value =
        '';


      pinInput.value =
        '';

    }



    /* ==========================================
       LOGGED OUT UI
    ========================================== */

    function showLoggedOutUI() {

      currentUser =
        null;


      clearProfileForm();


      emailInput.placeholder =
        'Sign in to see your email';


      disableProfileForm();


      signInLink.hidden =
        false;


      registerLink.hidden =
        false;


      logoutButton.hidden =
        true;


      accountUserBox.hidden =
        true;


      hideProfileMessage();


      showNotice(
        'Please sign in to view and manage your account.'
      );

    }



    /* ==========================================
       LOCAL DELIVERY DETAILS
    ========================================== */

    function loadLocalDeliveryDetails(
      userId
    ) {

      try {

        const key =
          'britTunaDelivery_' +
          userId;


        const saved =
          localStorage.getItem(
            key
          );


        if (!saved) {

          return;

        }


        const details =
          JSON.parse(
            saved
          );


        addressInput.value =
          details.address ||
          '';


        cityInput.value =
          details.city ||
          '';


        stateInput.value =
          details.state ||
          '';


        pinInput.value =
          details.pin ||
          '';

      }

      catch (error) {

        console.error(
          'Brit.Tuna: Could not load local delivery details:',
          error
        );

      }

    }



    function saveLocalDeliveryDetails(
      userId
    ) {

      try {

        const key =
          'britTunaDelivery_' +
          userId;


        const details = {

          address:
            addressInput.value.trim(),

          city:
            cityInput.value.trim(),

          state:
            stateInput.value.trim(),

          pin:
            pinInput.value.trim()

        };


        localStorage.setItem(
          key,
          JSON.stringify(
            details
          )
        );

      }

      catch (error) {

        console.error(
          'Brit.Tuna: Could not save local delivery details:',
          error
        );

      }

    }



    /* ==========================================
       LOAD PROFILE FROM SUPABASE
    ========================================== */

    async function loadProfile(
      user
    ) {

      currentUser =
        user;


      hideNotice();


      hideProfileMessage();



      /* ========================================
         EMAIL FROM SUPABASE AUTH
      ======================================== */

      emailInput.value =
        user.email ||
        '';



      /* ========================================
         GOOGLE / AUTH NAME
      ======================================== */

      const metadata =
        user.user_metadata ||
        {};


      const googleName =

        metadata.full_name ||

        metadata.name ||

        '';



      /* ========================================
         LOGGED-IN UI
      ======================================== */

      signInLink.hidden =
        true;


      registerLink.hidden =
        true;


      logoutButton.hidden =
        false;


      accountUserBox.hidden =
        false;


      accountUserName.textContent =

        googleName ||

        user.email ||

        'Brit.Tuna Customer';



      enableProfileForm();



      /* ========================================
         LOAD PROFILE TABLE
      ======================================== */

      try {

        const {
          data: profile,
          error
        } =

          await window.supabaseClient

            .from(
              'profiles'
            )

            .select(
              'id, full_name, phone, role'
            )

            .eq(
              'id',
              user.id
            )

            .maybeSingle();



        if (error) {

          console.error(
            'Brit.Tuna: Profile load error:',
            error
          );


          nameInput.value =
            googleName;


          loadLocalDeliveryDetails(
            user.id
          );


          return;

        }



        /* ======================================
           PROFILE EXISTS
        ====================================== */

        if (profile) {

          nameInput.value =

            profile.full_name ||

            googleName ||

            '';


          phoneInput.value =
            profile.phone ||
            '';


          accountUserName.textContent =

            profile.full_name ||

            googleName ||

            user.email ||

            'Brit.Tuna Customer';

        }

        else {

          /*
            The automatic signup trigger should
            normally create the profile.

            If a profile is missing, keep the
            Auth/Google name visible.
          */

          nameInput.value =
            googleName;

        }



        loadLocalDeliveryDetails(
          user.id
        );

      }

      catch (error) {

        console.error(
          'Brit.Tuna: Unexpected profile load error:',
          error
        );


        nameInput.value =
          googleName;


        loadLocalDeliveryDetails(
          user.id
        );

      }

    }



    /* ==========================================
       INITIAL ACCOUNT LOAD
    ========================================== */

    async function initialiseAccount() {

      if (
        !window.supabaseClient
      ) {

        showNotice(
          'Account service is not ready. Please refresh the page.'
        );


        disableProfileForm();


        return;

      }



      try {

        const {
          data,
          error
        } =

          await window.supabaseClient
            .auth
            .getSession();



        if (error) {

          console.error(
            'Brit.Tuna: Session error:',
            error
          );


          showLoggedOutUI();


          return;

        }



        const session =
          data
            ? data.session
            : null;



        if (
          !session ||
          !session.user
        ) {

          showLoggedOutUI();


          return;

        }



        console.log(
          'Brit.Tuna: Account session ready.'
        );


        await loadProfile(
          session.user
        );

      }

      catch (error) {

        console.error(
          'Brit.Tuna: Account initialization error:',
          error
        );


        showLoggedOutUI();

      }

    }



    /* ==========================================
       PROFILE SAVE

       IMPORTANT SECURITY CHANGE:

       OLD:
       .from('profiles').update(...)

       NEW:
       .rpc('update_my_profile', ...)

       Customer can update ONLY:
       - full_name
       - phone

       Customer cannot change:
       - role
    ========================================== */

    profileForm.addEventListener(

      'submit',

      async function (event) {

        event.preventDefault();


        hideProfileMessage();



        /* ======================================
           REQUIRE LOGIN
        ====================================== */

        if (!currentUser) {

          showProfileMessage(
            'Please sign in first.',
            true
          );


          return;

        }



        /* ======================================
           VALUES
        ====================================== */

        const fullName =
          nameInput.value.trim();


        const phone =
          phoneInput.value
            .replace(
              /\D/g,
              ''
            );


        const pin =
          pinInput.value
            .replace(
              /\D/g,
              ''
            );



        /* ======================================
           RESET VALIDATION ERRORS
        ====================================== */

        document.getElementById(
          'err-p-name'
        ).textContent =
          '';


        document.getElementById(
          'err-p-phone'
        ).textContent =
          '';


        document.getElementById(
          'err-p-pin'
        ).textContent =
          '';



        /* ======================================
           VALIDATE NAME
        ====================================== */

        if (
          fullName.length <
          2
        ) {

          document.getElementById(
            'err-p-name'
          ).textContent =
            'Please enter your full name.';


          nameInput.focus();


          return;

        }



        /* ======================================
           VALIDATE PHONE
        ====================================== */

        if (
          phone &&
          !/^[6-9][0-9]{9}$/.test(
            phone
          )
        ) {

          document.getElementById(
            'err-p-phone'
          ).textContent =
            'Enter a valid 10-digit Indian mobile number.';


          phoneInput.focus();


          return;

        }



        /* ======================================
           VALIDATE PIN
        ====================================== */

        if (
          pin &&
          !/^[1-9][0-9]{5}$/.test(
            pin
          )
        ) {

          document.getElementById(
            'err-p-pin'
          ).textContent =
            'Enter a valid 6-digit PIN code.';


          pinInput.focus();


          return;

        }



        /* ======================================
           SAVING UI
        ====================================== */

        saveButton.disabled =
          true;


        saveButton.textContent =
          'Saving...';



        try {

          /* ====================================
             VERIFY SESSION BEFORE UPDATE
          ==================================== */

          const {
            data: sessionData,
            error: sessionError
          } =

            await window.supabaseClient
              .auth
              .getSession();



          if (
            sessionError ||
            !sessionData ||
            !sessionData.session
          ) {

            showProfileMessage(
              'Your session has expired. Please sign in again.',
              true
            );


            showLoggedOutUI();


            return;

          }



          /* ====================================
             SECURE PROFILE UPDATE
          ==================================== */

          const {
            error
          } =

            await window.supabaseClient
              .rpc(
                'update_my_profile',
                {

                  new_full_name:
                    fullName,

                  new_phone:
                    phone ||
                    null

                }
              );



          if (error) {

            console.error(
              'Brit.Tuna: Secure profile update error:',
              error
            );


            showProfileMessage(
              'Could not save your profile. Please try again.',
              true
            );


            return;

          }



          /* ====================================
             SAVE ADDRESS LOCALLY
          ==================================== */

          saveLocalDeliveryDetails(
            currentUser.id
          );



          /* ====================================
             UPDATE SCREEN
          ==================================== */

          nameInput.value =
            fullName;


          phoneInput.value =
            phone;


          accountUserName.textContent =

            fullName ||

            currentUser.email ||

            'Brit.Tuna Customer';



          showProfileMessage(
            'Profile saved successfully.'
          );



          console.log(
            'Brit.Tuna: Profile securely updated.'
          );

        }

        catch (error) {

          console.error(
            'Brit.Tuna: Unexpected profile save error:',
            error
          );


          showProfileMessage(
            'Could not save your profile. Please try again.',
            true
          );

        }

        finally {

          if (currentUser) {

            saveButton.disabled =
              false;

          }


          saveButton.textContent =
            'Save profile';

        }

      }

    );



    /* ==========================================
       LOGOUT
    ========================================== */

    logoutButton.addEventListener(

      'click',

      async function () {

        if (
          !window.supabaseClient
        ) {

          return;

        }


        logoutButton.disabled =
          true;


        logoutButton.textContent =
          'Signing out...';



        try {

          const {
            error
          } =

            await window.supabaseClient
              .auth
              .signOut();



          if (error) {

            console.error(
              'Brit.Tuna: Logout error:',
              error
            );


            logoutButton.disabled =
              false;


            logoutButton.textContent =
              'Sign out';


            return;

          }



          window.location.href =
            'index.html';

        }

        catch (error) {

          console.error(
            'Brit.Tuna: Unexpected logout error:',
            error
          );


          logoutButton.disabled =
            false;


          logoutButton.textContent =
            'Sign out';

        }

      }

    );



    /* ==========================================
       AUTH STATE CHANGES
    ========================================== */

    if (
      window.supabaseClient
    ) {

      window.supabaseClient
        .auth
        .onAuthStateChange(

          function (
            event,
            session
          ) {

            console.log(
              'Brit.Tuna auth event:',
              event
            );



            if (
              event ===
              'SIGNED_OUT'
            ) {

              showLoggedOutUI();

            }



            if (
              event ===
                'SIGNED_IN' &&
              session &&
              session.user
            ) {

              loadProfile(
                session.user
              );

            }

          }

        );

    }



    /* ==========================================
       START
    ========================================== */

    initialiseAccount();

  </script>



<script>
  /* Header avatar initial + greeting (display only; account logic untouched) */
  (function () {
    var box = document.getElementById('account-user-box');
    var nameEl = document.getElementById('account-user-name');
    var sub = document.getElementById('acct-sub');
    var avatar = document.getElementById('acct-avatar');
    var title = document.getElementById('acct-title');
    var pName = document.getElementById('p-name');
    if (!box || !avatar) return;

    function refresh() {
      var signedIn = !box.hidden;
      var name = ((pName && pName.value) || (nameEl && nameEl.textContent) || '').trim();

      if (sub) sub.hidden = signedIn;

      if (signedIn && name) {
        if (title) title.textContent = name;
        avatar.textContent = name.charAt(0).toUpperCase();
      } else {
        if (title) title.textContent = 'My Account';
        avatar.textContent = 'B';
      }
    }

    new MutationObserver(refresh).observe(box, { attributes: true, attributeFilter: ['hidden'] });
    if (nameEl) new MutationObserver(refresh).observe(nameEl, { childList: true, characterData: true, subtree: true });
    if (pName) pName.addEventListener('input', refresh);
    setInterval(refresh, 1500);
    refresh();
  })();
</script>

</body>
