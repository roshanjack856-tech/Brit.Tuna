<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >


  <title>
    Create Account | Brit.Tuna
  </title>


  <meta
    name="description"
    content="Create your Brit.Tuna customer account."
  >


  <meta
    name="robots"
    content="noindex"
  >


  <meta
    name="theme-color"
    content="#1f5a3a"
  >



  <!-- ============================================
       GOOGLE FONTS
  ============================================= -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >


  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >


  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap"
    rel="stylesheet"
  >



  <!-- ============================================
       WEBSITE CSS
  ============================================= -->

  <link
    rel="stylesheet"
    href="style.css"
  >


  <link
    rel="stylesheet"
    href="responsive.css"
  >


</head>



<body data-page="register">


  <!-- ============================================
       HEADER
  ============================================= -->

  <div id="site-header"></div>



  <!-- ============================================
       MAIN
  ============================================= -->

  <main id="main">


    <!-- PAGE HERO -->

    <section class="page-hero">


      <div class="container">


        <h1>
          Create Account
        </h1>


        <p>
          Create your Brit.Tuna customer account.
        </p>


      </div>


    </section>



    <!-- ============================================
         REGISTER SECTION
    ============================================= -->

    <section class="auth-section">


      <div class="container">


        <div class="auth-card">


          <h2>
            Register
          </h2>


          <p>
            Enter your details to create your account.
          </p>



          <!-- ======================================
               REGISTER FORM
          ======================================= -->

          <form id="register-form">


            <!-- FULL NAME -->

            <div class="form-group">


              <label for="name">
                Full Name
              </label>


              <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                autocomplete="name"
                maxlength="100"
                required
              >


            </div>



            <!-- EMAIL -->

            <div class="form-group">


              <label for="email">
                Email Address
              </label>


              <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
              >


            </div>



            <!-- PASSWORD -->

            <div class="form-group">


              <label for="password">
                Password
              </label>


              <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                autocomplete="new-password"
                minlength="6"
                required
              >


            </div>



            <!-- CONFIRM PASSWORD -->

            <div class="form-group">


              <label for="confirm-password">
                Confirm Password
              </label>


              <input
                type="password"
                id="confirm-password"
                name="confirm-password"
                placeholder="Enter password again"
                autocomplete="new-password"
                minlength="6"
                required
              >


            </div>



            <!-- REGISTER BUTTON -->

            <button
              type="submit"
              id="register-button"
              class="btn btn-primary"
            >

              Create Account

            </button>



            <!-- MESSAGE -->

            <p
              id="register-message"
              role="status"
              aria-live="polite"
            ></p>


          </form>



          <!-- LOGIN LINK -->

          <div class="auth-footer">


            <p>

              Already have an account?

              <a href="login.html">
                Sign In
              </a>

            </p>


          </div>


        </div>


      </div>


    </section>


  </main>



  <!-- ============================================
       FOOTER
  ============================================= -->

  <div id="site-footer"></div>



  <!-- ============================================
       1. SUPABASE LIBRARY

       MUST load first
  ============================================= -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>



  <!-- ============================================
       2. BRIT.TUNA CONFIG

       MUST load before supabase.js
  ============================================= -->

  <script src="config.js"></script>



  <!-- ============================================
       3. CREATE SUPABASE CLIENT
  ============================================= -->

  <script src="supabase.js"></script>



  <!-- ============================================
       4. WEBSITE SCRIPT
  ============================================= -->

  <script src="script.js"></script>



  <!-- ============================================
       5. CUSTOMER REGISTRATION
  ============================================= -->

  <script>

    'use strict';



    /* ==========================================
       ELEMENTS
    ========================================== */

    const registerForm =
      document.getElementById(
        'register-form'
      );


    const registerMessage =
      document.getElementById(
        'register-message'
      );


    const registerButton =
      document.getElementById(
        'register-button'
      );



    /* ==========================================
       FORM SUBMIT
    ========================================== */

    registerForm.addEventListener(

      'submit',

      async function (event) {


        event.preventDefault();



        /* ----------------------------------------
           CHECK SUPABASE CONNECTION
        ----------------------------------------- */

        if (!window.supabaseClient) {

          console.error(
            'Brit.Tuna: supabaseClient is not available.'
          );


          registerMessage.textContent =
            'Database connection is not ready. Please refresh the page and try again.';


          return;

        }



        /* ----------------------------------------
           GET VALUES
        ----------------------------------------- */

        const fullName =
          document
            .getElementById('name')
            .value
            .trim();


        const email =
          document
            .getElementById('email')
            .value
            .trim()
            .toLowerCase();


        const password =
          document
            .getElementById('password')
            .value;


        const confirmPassword =
          document
            .getElementById(
              'confirm-password'
            )
            .value;



        /* ========================================
           VALIDATION
        ======================================== */

        if (!fullName) {

          registerMessage.textContent =
            'Please enter your full name.';

          return;

        }



        if (!email) {

          registerMessage.textContent =
            'Please enter your email address.';

          return;

        }



        if (password.length < 6) {

          registerMessage.textContent =
            'Password must contain at least 6 characters.';

          return;

        }



        if (
          password !== confirmPassword
        ) {

          registerMessage.textContent =
            'Passwords do not match.';

          return;

        }



        /* ========================================
           LOADING
        ======================================== */

        registerButton.disabled = true;


        registerButton.textContent =
          'Creating Account...';


        registerMessage.textContent =
          'Creating your account...';



        try {


          /* ======================================
             CREATE CUSTOMER IN SUPABASE AUTH
          ======================================= */

          const {
            data,
            error
          } =

            await window.supabaseClient
              .auth
              .signUp({

                email: email,

                password: password,

                options: {

                  data: {

                    full_name:
                      fullName

                  }

                }

              });



          /* ======================================
             ERROR
          ======================================= */

          if (error) {


            console.error(
              'Registration error:',
              error
            );


            registerMessage.textContent =
              error.message;


            registerButton.disabled =
              false;


            registerButton.textContent =
              'Create Account';


            return;

          }



          /* ======================================
             CHECK USER
          ======================================= */

          if (
            !data ||
            !data.user
          ) {


            registerMessage.textContent =
              'Account could not be created. Please try again.';


            registerButton.disabled =
              false;


            registerButton.textContent =
              'Create Account';


            return;

          }



          console.log(
            'Brit.Tuna: Customer account created:',
            data.user.id
          );



          /* ======================================
             EMAIL CONFIRMATION REQUIRED
          ======================================= */

          if (!data.session) {


            registerMessage.textContent =
              'Account created successfully! Please check your email and confirm your account before signing in.';


            registerForm.reset();


            registerButton.disabled =
              false;


            registerButton.textContent =
              'Create Account';


            return;

          }



          /* ======================================
             CUSTOMER ALREADY LOGGED IN
          ======================================= */

          registerMessage.textContent =
            'Account created successfully! Redirecting...';


          registerForm.reset();



          /* ======================================
             REDIRECT
          ======================================= */

          setTimeout(

            function () {


              window.location.href =
                'account.html';


            },

            1200

          );


        }

        catch (error) {


          console.error(
            'Unexpected registration error:',
            error
          );


          registerMessage.textContent =
            'Something went wrong. Please try again.';


          registerButton.disabled =
            false;


          registerButton.textContent =
            'Create Account';


        }


      }

    );

  </script>


</body>

</html>
