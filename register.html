<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Create Account | Brit.Tuna</title>

  <meta
    name="description"
    content="Create your Brit.Tuna customer account."
  >

  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1f5a3a">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap"
    rel="stylesheet"
  >

  <!-- Website CSS -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="responsive.css">

</head>

<body data-page="register">

  <!-- Header -->
  <div id="site-header"></div>


  <main id="main">

    <!-- HERO -->
    <section class="page-hero">

      <div class="container">

        <h1>Create Account</h1>

        <p>
          Create your Brit.Tuna customer account.
        </p>

      </div>

    </section>


    <!-- REGISTER -->
    <section class="auth-section">

      <div class="container">

        <div class="auth-card">

          <h2>Register</h2>

          <p>
            Enter your details to create your account.
          </p>


          <form id="register-form">


            <!-- NAME -->

            <div class="form-group">

              <label for="name">
                Full Name
              </label>

              <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                autocomplete="name"
                required
              >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

              <label for="email">
                Email Address
              </label>

              <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
              >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

              <label for="password">
                Password
              </label>

              <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                autocomplete="new-password"
                minlength="6"
                required
              >

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

              <label for="confirm-password">
                Confirm Password
              </label>

              <input
                type="password"
                id="confirm-password"
                name="confirm-password"
                placeholder="Enter password again"
                autocomplete="new-password"
                minlength="6"
                required
              >

            </div>


            <!-- REGISTER BUTTON -->

            <button
              type="submit"
              id="register-button"
              class="btn btn-primary"
            >
              Create Account
            </button>


            <!-- STATUS -->

            <p
              id="register-message"
              role="status"
              aria-live="polite"
            ></p>

          </form>


          <!-- LOGIN LINK -->

          <div class="auth-footer">

            <p>
              Already have an account?

              <a href="login.html">
                Sign In
              </a>

            </p>

          </div>

        </div>

      </div>

    </section>

  </main>


  <!-- Footer -->
  <div id="site-footer"></div>


  <!-- SUPABASE JS LIBRARY -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <!-- Your Supabase configuration -->
  <script src="config.js"></script>


  <!-- Creates supabaseClient -->
  <script src="supabase.js"></script>


  <!-- Your normal website script -->
  <script src="script.js"></script>


  <!-- CUSTOMER REGISTRATION -->
  <script>

    const registerForm =
      document.getElementById("register-form");

    const registerMessage =
      document.getElementById("register-message");

    const registerButton =
      document.getElementById("register-button");


    registerForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const name =
          document
            .getElementById("name")
            .value
            .trim();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        const confirmPassword =
          document
            .getElementById("confirm-password")
            .value;


        /* CHECK PASSWORD */

        if (password !== confirmPassword) {

          registerMessage.textContent =
            "Passwords do not match.";

          return;

        }


        if (password.length < 6) {

          registerMessage.textContent =
            "Password must contain at least 6 characters.";

          return;

        }


        registerButton.disabled = true;

        registerMessage.textContent =
          "Creating your account...";


        try {

          const { data, error } =
            await supabaseClient.auth.signUp({

              email: email,

              password: password,

              options: {

                data: {
                  full_name: name
                }

              }

            });


          /* ERROR */

          if (error) {

            console.error(
              "Registration error:",
              error
            );

            registerMessage.textContent =
              error.message;

            registerButton.disabled = false;

            return;

          }


          /* SUCCESS */

          if (data.user) {

            /*
              If Supabase email confirmation
              is enabled, session will normally
              be null until email confirmation.
            */

            if (!data.session) {

              registerMessage.textContent =
                "Account created! Please check your email and confirm your account before signing in.";

              registerForm.reset();

              registerButton.disabled = false;

              return;

            }


            /*
              If email confirmation is disabled,
              the customer may already have
              a valid session.
            */

            registerMessage.textContent =
              "Account created successfully! Redirecting...";


            setTimeout(function() {

              window.location.href =
                "account.html";

            }, 1200);

          }


        } catch (error) {

          console.error(
            "Unexpected registration error:",
            error
          );


          registerMessage.textContent =
            "Something went wrong. Please try again.";


          registerButton.disabled = false;

        }

      }
    );

  </script>

</body>
</html>
